name: CI

# Every pull request and every push to main -- once the repository is public.
#
# While it is private every job skips itself (a skipped job bills nothing), as in
# SprintEngine Studio: agents land commits on main in bursts, and a public
# repository gets unlimited standard-runner minutes, so the gate switches itself
# on the moment the repository is made public. Until then it runs when
# dispatched by hand, and as the release workflow's quality gate (workflow_call
# with release_gate), which is never skipped.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string
      release_gate:
        description: "Called by release.yml: run regardless of repository visibility"
        required: true
        type: boolean

permissions:
  contents: read

# A newer push supersedes an older one; a release gate gets a group of its own
# so no push can cancel it.
concurrency:
  group: ${{ inputs.release_gate && format('ci-release-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_gate }}

jobs:
  # The site's own gates, whole: tsc -b and the build, every unit test vitest
  # discovers (vitest.config.ts, so a new test file is in the gate the moment it
  # is written), the UI and design-token lints with the probes that prove they
  # still bite, and the API and Cloudflare Worker type checks.
  web:
    name: Site (build, unit tests, lints)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (tsc -b, vite)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: UI and design-system lints
        run: npm run ui:lint
      - name: Marketplace API type check
        run: npx tsc -p market/api/tsconfig.json --noEmit

  # On the image's Python (force5/Dockerfile is python:3.12-slim), under the same
  # pins, so a test that passes here passes where the importers actually run.
  ingest:
    name: Ingest (Python unit tests, schedules)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: force5/ingest/requirements*.txt
      - run: pip install -r force5/ingest/requirements-worker.txt -c force5/ingest/requirements-lock.txt
      - name: Ingest unit tests
        run: python -m unittest discover -s force5/ingest -p 'test_*.py'
      - name: Schedule generator tests
        run: python -m unittest discover -s deploy -p 'test_*.py'
      # deploy/home-compute is not a package, so the step above does not reach it.
      - name: Home Compute panel tests
        run: python -m unittest discover -s deploy/home-compute -p 'test_*.py'
      # The production monitor (.github/workflows/monitor.yml): standard library only.
      - name: Release script tests
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      # The satellite pipeline's pure parts (scripts/satellite): numpy only.
      - name: Satellite pipeline tests
        run: python -m unittest discover -s scripts/satellite -p 'test_*.py'
      # Home Compute's and Cloudflare's timetables are generated from
      # deploy/local/jobs.toml; an edit to one without the others fails here.
      - name: Generated timetables are current
        run: python deploy/schedules.py --check

  # The whole Playwright suite against the staged sample site (scripts/e2e-site.mjs):
  # the map, the dock, spot pages, the marketplace and the community.
  # Split over four runners: one runner took 20-30 minutes, against the 30 minute limit.
  # --fully-parallel splits by test, not by file (dock.spec.ts alone is a fifth of the
  # suite); each runner still runs one test at a time.
  e2e:
    name: End-to-end (Chromium, ${{ matrix.shard }}/4)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test --project=desktop --project=phone --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  # The Docker images are the artifacts that run in production. The site and the
  # marketplace API are built here. The forecast worker is the jobs below: it is
  # built on the runner that matches each platform, smoked there, then merged
  # into a manifest list that must name both. No network fetch of a forecast:
  # that is the release's acceptance step.
  images:
    name: Images (site, marketplace)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile.web
          tags: wingfoil-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build the marketplace API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: market/Dockerfile
          tags: wingfoil-market:ci
          load: true
          cache-from: type=gha,scope=market
          cache-to: type=gha,mode=max,scope=market
      - name: Site image smoke
        run: scripts/release/web-image-smoke.sh wingfoil-web:ci
      - name: Marketplace API image boots
        run: scripts/release/market-image-smoke.sh wingfoil-market:ci

  # Native runners, not QEMU. ubuntu-24.04-arm is a standard hosted runner.
  # Provenance stays off so the saved image is one platform, which is what the
  # manifest job merges.
  forecast:
    name: Forecast image (${{ matrix.platform }})
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the forecast worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: force5/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: wingfoil-forecast:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=forecast-ci-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=forecast-ci-${{ matrix.pair }}
      - name: Worker image smoke
        run: scripts/release/worker-image-smoke.sh wingfoil-forecast:ci
      - name: Save the image for the manifest list
        run: docker save wingfoil-forecast:ci -o "forecast-${{ matrix.pair }}.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: forecast-image-${{ matrix.pair }}
          path: forecast-${{ matrix.pair }}.tar
          if-no-files-found: error
          retention-days: 1

  forecast-manifest:
    name: Forecast manifest list
    needs: forecast
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: forecast-image-linux-amd64
          path: forecast-images/amd64
      - uses: actions/download-artifact@v8
        with:
          name: forecast-image-linux-arm64
          path: forecast-images/arm64
      # imagetools reads the local registry through BuildKit. host networking
      # makes 127.0.0.1 the runner, and the registry speaks HTTP.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true
              insecure = true
      - name: Both platforms are in one manifest list
        run: scripts/release/local-manifest.sh forecast-images/amd64/forecast-linux-amd64.tar forecast-images/arm64/forecast-linux-arm64.tar

  # The app (mobile/, docs/MOBILE.md): its own gate, npm run ci (typecheck,
  # eslint, the token lint and its self-test, unit tests), then Metro bundling
  # both platforms, which is what an over-the-air update ships. The root's
  # modules are installed too: the app imports the site's forecast code, and
  # its tests reach the site's dependencies through it. No native compile (a
  # store build is EAS's, at release); the fingerprint that decides whether one
  # is needed is printed in the summary instead.
  mobile:
    name: App (typecheck, lints, tests, bundles)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # app.config.ts turns over-the-air updates on with it, which the
      # fingerprint counts: with it set, the hash below is the one EAS computes.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: Typecheck, lints, unit tests
        working-directory: mobile
        run: npm run ci
      - name: Bundle iOS and Android (expo export)
        working-directory: mobile
        run: npm run export:check
      - name: Runtime fingerprints
        working-directory: mobile
        run: |
          {
            echo "### App runtime fingerprints"
            echo
            echo "An over-the-air update reaches only binaries with the same fingerprint (mobile/fingerprint.config.js)."
            if [ -z "$EAS_PROJECT_ID" ]; then echo "EAS_PROJECT_ID is not set, so these are for a build with updates off."; fi
            echo
            echo "| Platform | Fingerprint |"
            echo "| --- | --- |"
            for platform in ios android; do
              echo "| $platform | \`$(npx expo-updates fingerprint:generate --platform "$platform" | jq -r .hash)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory, on pull requests: does this change the app's native code? If the
  # fingerprint moves, the next release builds new store binaries (and riders
  # on older ones need the store); if not, it ships over the air. Never fails
  # and labels nothing: it writes the answer in the run's summary, as t3code's
  # mobile-fingerprint-check does in a comment.
  mobile-fingerprint:
    name: App native change (advisory)
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Fingerprints of this change
        working-directory: mobile
        run: |
          npm ci
          for platform in ios android; do npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/head-$platform.json"; done
      # The fingerprint reads mobile/ only, so the base's mobile/ is enough.
      - name: Fingerprints of the base
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git archive "$BASE_SHA" mobile | tar -x -C "$RUNNER_TEMP/base"; then echo "The base has no app."; exit 0; fi
          cd "$RUNNER_TEMP/base/mobile"
          npm ci
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/base-$platform.json" || rm -f "$RUNNER_TEMP/base-$platform.json"
          done
      - name: Compare
        run: |
          { echo "### App native change"; echo; } >> "$GITHUB_STEP_SUMMARY"
          for platform in ios android; do
            node scripts/release/mobile.mjs fingerprint-diff "$RUNNER_TEMP/base-$platform.json" "$RUNNER_TEMP/head-$platform.json" "$platform"
          done
