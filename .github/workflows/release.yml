name: Release

# Main feeds a nightly train; a release stages what a nightly already built, and
# a promote puts exactly what staging tested into production. docs/RELEASES.md
# walks through it.
#
#   schedule (02:17 UTC)   a nightly of main's head, but only when main has commits
#                          the last nightly did not build. A main that no longer
#                          contains the last nightly (history rewritten) FAILS the
#                          resolve step rather than skipping quietly.
#   dispatch nightly       a nightly of main's head now, gate skipped
#   dispatch release       STAGING ONLY: the latest nightly (or the one named) --
#                          the SAME image digests and the SAME site build, never a
#                          rebuild -- tagged :staging, tested again, the site
#                          deployed to staging; then recorded as the prerelease
#                          v<date>-rc.<run> (images.json, site.tar.gz, staged.json)
#   dispatch promote       PRODUCTION ONLY: the newest staged candidate that passed
#                          (or the one named), byte for byte -- its digests get
#                          :production and :latest, its site goes to production,
#                          and the v<date> release is created
#
# The gap between release and promote is the human gate: look at staging, then
# promote. (An environment's required reviewers would do it in one run, but they
# need a paid plan on a private repository; `environment: production` stays on
# the production job, so they work the day the repository is public.)
#
# A nightly builds the three images (forecast worker, site, marketplace API) and
# the static site once, runs the whole CI gate against the commit, smoke-tests
# each image, then runs acceptance: the worker fetches real HARMONIE and GFS
# runs, publishes them to an S3-compatible bucket, and the site image draws them
# in a browser. Only then is anything published: a prerelease v<date>-nightly.<run>
# carrying images.json (the digests) and the site, and the images' :nightly tag.
#
# Production today is the forecast worker, which the Mac mini runs by pulling
# :production (deploy/home-compute/macmini.sh pull), and the site on Cloudflare
# Pages once the repository variables in docs/RELEASES.md exist (skipped with a
# notice until then).
#
# The app (mobile/, docs/MOBILE.md) rides the same train, once EXPO_TOKEN and
# EAS_PROJECT_ID exist (every app step is a notice until then, as the site is
# without Cloudflare):
#
#   nightly    its JavaScript published ONCE as an EAS update, on an EAS branch
#              named for the nightly's tag that no channel points at; mobile.json
#              (the update groups, their runtimes, the binaries that can run them)
#              goes on the prerelease
#   release    the `staging` channel pointed at that branch; a staging binary
#              built and submitted (TestFlight, Play internal) only if none runs
#              its runtime yet; recorded in staged.json
#   promote    the `production` channel pointed at the SAME branch, checked to
#              hold exactly the groups staging ran; app/latest.json published with
#              the site; riders told; then a production binary built and
#              submitted for review only if none runs the runtime yet
#
# Staging and production run the train's own logic (scripts/release/release.mjs
# and mobile.mjs) from this workflow's commit, checked out under .train, and the
# tests from the commit being shipped: a candidate staged before a change to the
# train can still be promoted by the train as it is now.
run-name: "${{ github.event_name == 'schedule' && 'nightly (scheduled)' || format('{0} {1}{2}', inputs.channel, inputs.nightly, inputs.staged) }}"

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "nightly builds main now; release stages a nightly on staging; promote puts a staged build in production"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release
          - promote
      nightly:
        description: "release only: the nightly tag to stage (default: the newest)"
        required: false
        default: ""
        type: string
      staged:
        description: "promote only: the staged v<date>-rc.<run> to promote (default: the newest that passed staging)"
        required: false
        default: ""
        type: string

# Two queues, neither cancelling: a cancelled release can leave a half-moved tag.
# Release and promote share one, so a promote never runs beside a staging.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGES: ghcr.io/${{ github.repository_owner }}/wingfoil
  # EAS CLI, pinned: the app's train reads its JSON (scripts/release/mobile.mjs).
  EAS_CLI: "24.13.0"

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read is how a promote asks whether the run that staged a
    # candidate passed its Staging job.
    permissions:
      contents: read
      actions: read
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      nightly_tag: ${{ steps.resolve.outputs.nightly_tag }}
      staged_tag: ${{ steps.resolve.outputs.staged_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A shut gate ends the run here, green, with should_build=false; a refusal
      # (main rewritten under the last nightly, a commit already released, a
      # candidate that did not pass staging or is behind production) exits
      # non-zero, so it is seen. scripts/release/release.mjs has the rules.
      - id: resolve
        name: Channel, version and commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_NIGHTLY: ${{ inputs.nightly }}
          DISPATCH_STAGED: ${{ inputs.staged }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.mjs resolve

  # ---------------------------------------------------------------- nightly ---

  quality:
    name: Quality gate
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      release_gate: true

  images:
    name: Image (${{ matrix.name }})
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: forecast
            file: force5/Dockerfile
          - name: web
            file: deploy/local/Dockerfile.web
          - name: market
            file: market/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      # What deploy/home-compute/panel.py compares to say whether the image the
      # Mac mini runs matches a checkout.
      - id: hash
        name: Source hash
        run: echo "value=$(python3 -I deploy/home-compute/panel.py source-hash)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed under the run's own tags only; :nightly moves in the publish job,
      # after every gate, so it never names an image that failed one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGES }}-${{ matrix.name }}:${{ needs.resolve.outputs.version }}
            ${{ env.IMAGES }}-${{ matrix.name }}:sha-${{ needs.resolve.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.ref }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            wingfoil.source-hash=${{ steps.hash.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${IMAGES}-${{ matrix.name }}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7

  # One static build for every environment: release.mjs configure-site points it
  # at an environment's forecast data at deploy time.
  site:
    name: Site build
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -czf site.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  acceptance:
    name: Acceptance (images, real forecasts)
    needs: [resolve, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Pull the pushed images
        run: for name in forecast web market; do docker pull -q "$(cat "digests/$name")"; done
      - name: Worker image smoke
        run: scripts/release/worker-image-smoke.sh "$(cat digests/forecast)"
      - name: Site image smoke
        run: scripts/release/web-image-smoke.sh "$(cat digests/web)"
      - name: Marketplace API image smoke
        run: scripts/release/market-image-smoke.sh "$(cat digests/market)"
      - name: Real forecasts, a bucket and a browser
        run: scripts/release/acceptance.sh "$(cat digests/forecast)" "$(cat digests/web)"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-report-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  # The app's JavaScript, published once as an EAS update on a branch of its
  # own (the nightly's tag) that no channel points at: staging and production
  # are later pointed at this very branch, so they get these bytes. The update
  # is built with EAS's `production` environment variables (EXPO_PUBLIC_*,
  # docs/MOBILE.md), which the staging and production apps share. mobile.json
  # records the groups, their runtimes (fingerprints) and which staging and
  # production binaries already run them.
  mobile:
    name: App update (EAS)
    needs: [resolve, quality]
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - id: app
        name: Is EAS set up?
        run: |
          if [ -n "$EXPO_TOKEN" ] && [ -n "$EAS_PROJECT_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=App::EXPO_TOKEN (secret) or EAS_PROJECT_ID (variable) is not set, so no app update was published. docs/MOBILE.md says how to set them up."
            node scripts/release/mobile.mjs record-unconfigured mobile.json "EXPO_TOKEN or EAS_PROJECT_ID was not set"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: npm ci
      - if: steps.app.outputs.run == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish the update, once, on the nightly's own branch
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: |
          eas update --branch "$TAG" --message "$TAG (${REF:0:12})" --platform all \
            --environment production --non-interactive --json > ../update.json
          jq . ../update.json
      - name: The store binaries that already run it
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: |
          for platform in ios android; do
            runtime="$(jq -r --arg p "$platform" '[.[] | select((.platform | ascii_downcase) == $p)][0].runtimeVersion' ../update.json)"
            eas build:list --platform "$platform" --runtime-version "$runtime" --status finished --distribution store \
              --limit 50 --json --non-interactive > "../builds-$platform.json"
          done
      - name: mobile.json
        if: steps.app.outputs.run == 'true'
        env:
          UPDATE_JSON: update.json
          BUILDS_JSON: builds-ios.json,builds-android.json
        run: |
          node scripts/release/mobile.mjs record-nightly mobile.json
          {
            echo "### App update \`$TAG\`"
            echo
            echo "Published on EAS branch \`$TAG\`; no channel points at it until a release stages it."
            echo
            echo "| Platform | Update group | Runtime | Staging binary | Production binary |"
            echo "| --- | --- | --- | --- | --- |"
            for p in ios android; do
              jq -r --arg p "$p" '"| \($p) | `\(.updates[$p].group)` | `\(.updates[$p].runtimeVersion[0:12])` | \(.native.staging[$p] // "none: release builds one") | \(.native.production[$p] // "none: promote builds one") |"' mobile.json
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile
          path: mobile.json
          retention-days: 7

  publish:
    name: Publish nightly
    needs: [resolve, quality, images, site, acceptance, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@v8
        with:
          name: site
      - uses: actions/download-artifact@v8
        with:
          name: mobile
      - name: images.json
        run: |
          jq -n --arg version "$VERSION" --arg commit "$REF" \
            --arg forecast "$(cat digests/forecast)" --arg web "$(cat digests/web)" --arg market "$(cat digests/market)" \
            '{version: $version, commit: $commit, images: {forecast: $forecast, web: $web, market: $market}}' > images.json
          cat images.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move :nightly to these digests
        run: |
          for name in forecast web market; do
            docker buildx imagetools create -t "${IMAGES}-${name}:nightly" "$(cat "digests/$name")"
          done
      - name: Release notes
        env:
          IMAGES_JSON: images.json
          MOBILE_JSON: mobile.json
        run: node scripts/release/release.mjs notes release-notes.md
      # --target creates the tag on the commit that was built, not on wherever
      # main has moved since.
      - name: Publish the prerelease
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --prerelease --latest=false \
            --title "Nightly ${VERSION}" --notes-file release-notes.md images.json site.tar.gz mobile.json
      # A failure here leaves the nightly it follows published, so it does not fail the job.
      - name: Delete the older nightly releases (their tags stay)
        continue-on-error: true
        run: node scripts/release/release.mjs prune-nightlies 7

  # ---------------------------------------------------------------- release ---

  # Staging only. The nightly's digests get :staging, and the tests run against
  # exactly them: every image smoke and the real-forecast acceptance again
  # (today's providers, not the night's), then -- once Cloudflare is configured --
  # the site deployed to the staging branch and the smoke suite against it. Its
  # last step records what passed as the prerelease v<date>-rc.<run>, which is
  # what a promote reads: nothing is recorded for a staging that failed.
  # The app's half of staging, before the site's (Staging needs it, so a
  # candidate is only recorded once both passed). The `staging` channel is
  # pointed at the nightly's EAS branch, after checking the branch holds exactly
  # the update groups the nightly recorded. If no staging binary runs the
  # update's runtime yet, one is built and submitted (TestFlight internal, Play
  # internal), from the nightly's commit, and must come out with that runtime.
  # Its working files live outside the checkout, which EAS uploads to build.
  staging-app:
    name: Staging (app)
    needs: resolve
    if: needs.resolve.outputs.channel == 'release'
    runs-on: ubuntu-latest
    # A store build waits in EAS's queue, then 15-30 minutes per platform.
    timeout-minutes: 180
    environment:
      name: staging
    permissions:
      contents: read
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly_tag }}
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/checkout@v7
        with:
          path: .train
          sparse-checkout: scripts/release
      - name: Keep the train and the working files out of what EAS uploads
        run: |
          mkdir -p "$RUNNER_TEMP/app/eas"
          mv .train "$RUNNER_TEMP/train"
          {
            echo "TRAIN=$RUNNER_TEMP/train/scripts/release"
            echo "W=$RUNNER_TEMP/app"
            echo "MOBILE_JSON=$RUNNER_TEMP/app/mobile.json"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: The nightly's app update
        run: |
          gh release download "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" -p mobile.json -D "$W" \
            || echo "$NIGHTLY_TAG has no mobile.json."
      - id: app
        name: Is there an app to stage?
        run: node "$TRAIN/mobile.mjs" gate
      - if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: npm ci
      - if: steps.app.outputs.run == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: The branch holds exactly the nightly's update
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          BRANCH: ${{ steps.app.outputs.branch }}
          UPDATE_GROUPS: ${{ steps.app.outputs.groups }}
        run: |
          eas branch:view "$BRANCH" --json --non-interactive > "$W/eas/branch.json"
          for group in $UPDATE_GROUPS; do eas update:view "$group" --json > "$W/eas/group-$group.json"; done
          node "$TRAIN/mobile.mjs" verify-update "$W/eas"
      - name: Point the staging channel at it
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          BRANCH: ${{ steps.app.outputs.branch }}
        run: |
          eas channel:view staging --json --non-interactive > /dev/null 2>&1 || eas channel:create staging --non-interactive
          eas channel:edit staging --branch "$BRANCH" --non-interactive
      - id: need
        name: Staging binaries for its runtime
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          IOS_RUNTIME: ${{ steps.app.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ steps.app.outputs.android_runtime }}
        run: |
          eas build:list --platform ios --runtime-version "$IOS_RUNTIME" --build-profile staging --status finished \
            --limit 50 --json --non-interactive > "$W/builds-ios.json"
          eas build:list --platform android --runtime-version "$ANDROID_RUNTIME" --build-profile staging --status finished \
            --limit 50 --json --non-interactive > "$W/builds-android.json"
          BUILDS_JSON="$W/builds-ios.json,$W/builds-android.json" CHECK_SUBMIT=true node "$TRAIN/mobile.mjs" needs-build staging
      - name: Build and submit the staging app (TestFlight, Play internal)
        if: steps.app.outputs.run == 'true' && steps.need.outputs.eas_platform != ''
        working-directory: mobile
        env:
          PLATFORM: ${{ steps.need.outputs.eas_platform }}
        run: |
          eas build --profile staging --platform "$PLATFORM" --auto-submit --non-interactive --wait --json \
            --message "$NIGHTLY_TAG (${REF:0:12})" > "$W/built.json"
          node "$TRAIN/mobile.mjs" check-built "$W/built.json"
      - name: Record what staging did with the app
        if: steps.app.outputs.run == 'true'
        env:
          CHANNEL: staging
          BUILDS_JSON: ${{ format('{0}/app/builds-ios.json,{0}/app/builds-android.json', runner.temp) }}
          BUILT_JSON: ${{ format('{0}/app/built.json', runner.temp) }}
        run: |
          node "$TRAIN/mobile.mjs" record-app-staged "$W/app-staged.json"
          {
            echo "### The staging app"
            echo
            echo "The \`staging\` channel now serves EAS branch \`$(jq -r .branch "$W/app-staged.json")\`."
            for p in ios android; do
              jq -r --arg p "$p" '"- \($p): " + (if .binaries[$p] == null then "no binary" elif .binaries[$p].builtNow then "new binary \(.binaries[$p].version) (\(.binaries[$p].build)), submitted: it reaches testers once the store has processed it" else "binary \(.binaries[$p].version) (\(.binaries[$p].build)) already installed: the update arrives on its next launch" end)' "$W/app-staged.json"
            done
            echo
            echo "Try it before promoting: **Wingfoil Staging** from TestFlight (iOS) or Google Play's internal testing track (Android). Settings → About shows the update it runs; *Check for updates* fetches it at once."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: app-staged
          path: |
            ${{ runner.temp }}/app/app-staged.json
            ${{ runner.temp }}/app/mobile.json
          if-no-files-found: ignore
          retention-days: 7

  staging:
    name: Staging
    needs: [resolve, staging-app]
    if: needs.resolve.outputs.channel == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: ${{ vars.STAGING_SITE_URL }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly_tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      # The train's logic as this workflow has it (see the header).
      - uses: actions/checkout@v7
        with:
          path: .train
          sparse-checkout: scripts/release
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The nightly's images and site
        run: |
          gh release download "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" -p images.json -p site.tar.gz
          jq . images.json
          test "$(jq -r .commit images.json)" = "$REF"
      # mobile.json, and app-staged.json when Staging (app) staged the app; the
      # artifact is empty, or absent, for a nightly from before the app's train.
      - name: The app's part
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: app-staged
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the digests :staging and the staged version
        run: |
          for name in forecast web market; do
            digest="$(jq -r ".images.$name" images.json)"
            docker buildx imagetools create -t "${IMAGES}-${name}:staging" -t "${IMAGES}-${name}:${VERSION}" "$digest"
          done
      - name: Pull them
        run: for name in forecast web market; do docker pull -q "$(jq -r ".images.$name" images.json)"; done
      - name: Image smoke
        run: |
          scripts/release/worker-image-smoke.sh "$(jq -r .images.forecast images.json)"
          scripts/release/web-image-smoke.sh "$(jq -r .images.web images.json)"
          scripts/release/market-image-smoke.sh "$(jq -r .images.market images.json)"
      - name: Real forecasts, a bucket and a browser
        run: scripts/release/acceptance.sh "$(jq -r .images.forecast images.json)" "$(jq -r .images.web images.json)"
      - name: Deploy the site to staging
        if: env.PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The checkout has its own site/ (the marketplace's users module), so the
          # build unpacks beside it, into pages/.
          mkdir pages && tar -xzf site.tar.gz -C pages
          node .train/scripts/release/release.mjs configure-site pages "${{ vars.STAGING_FORECAST_BASE_URL }}"
          npx --yes wrangler@4 pages deploy pages --project-name "$PAGES_PROJECT" --branch staging \
            --commit-hash "$REF" --commit-message "${VERSION} (staging)"
      - name: Smoke the staging site
        if: env.PAGES_PROJECT != ''
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_SITE_URL }}
          SMOKE_MANIFESTS: weather/harmonie.json,weather/gfs.json
        run: npx playwright test -c playwright.smoke.config.ts
      - name: No site deployment configured
        if: env.PAGES_PROJECT == ''
        run: echo "::notice::CLOUDFLARE_PAGES_PROJECT is not set, so no site was deployed to staging. docs/RELEASES.md says how to set it up."
      # Everything above passed: record it. staged.json carries the digests, the
      # sha256 of images.json and site.tar.gz, the nightly, the commit and this
      # run, which is what a promote checks before it moves anything.
      - name: Record what was staged
        env:
          SITE_DEPLOYED: ${{ env.PAGES_PROJECT != '' }}
          SITE_URL: ${{ vars.STAGING_SITE_URL }}
          FORECAST_BASE: ${{ vars.STAGING_FORECAST_BASE_URL }}
        run: node .train/scripts/release/release.mjs record-staged staged.json
      - name: Release notes
        env:
          IMAGES_JSON: images.json
          MOBILE_JSON: mobile.json
        run: node .train/scripts/release/release.mjs notes release-notes.md
      # --target tags the commit that was staged, not wherever main has moved since.
      # This is the job's last real step, so a candidate exists only for a
      # staging that passed; promote still asks GitHub how this job ended.
      - name: Publish the staged candidate
        env:
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
        run: |
          files=(images.json site.tar.gz staged.json)
          if [ -f mobile.json ]; then files+=(mobile.json); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --prerelease --latest=false \
            --title "Staged ${VERSION}" --notes-file release-notes.md "${files[@]}"
          {
            echo "### Staged as \`$TAG\`"
            echo
            echo "From \`$NIGHTLY_TAG\`, commit \`${REF:0:12}\`."
            if [ -n "$PAGES_PROJECT" ]; then echo "Look at the site on staging: $STAGING_SITE_URL"; fi
            if [ -f app-staged.json ]; then echo "Try the staging app (TestFlight, Play internal): it runs EAS branch \`$(jq -r .branch app-staged.json)\`."; fi
            echo
            echo "When it is right: *Actions → Release → Run workflow → promote* (staged: \`$TAG\`, or empty for the newest that passed)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-report-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  # ---------------------------------------------------------------- promote ---

  # Production only, from a staged candidate resolve has already vetted (its
  # Staging job passed, its commit is unreleased and contains what production
  # runs). The files are checked against staged.json before anything moves, so
  # production gets byte for byte what staging tested: the same digests, the
  # same site.tar.gz, pointed at production's data.
  #
  # `environment: production` has no protection rules while the repository is
  # private (required reviewers need a paid plan there); the separate promote
  # dispatch is the gate. Made public, the environment can add a reviewer too.
  production:
    name: Production
    needs: resolve
    if: needs.resolve.outputs.channel == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      STAGED_TAG: ${{ needs.resolve.outputs.staged_tag }}
      NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly_tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          path: .train
          sparse-checkout: scripts/release
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # mobile.json too when staging recorded one; verify-staged then checks it
      # is the file staging hashed and names the update groups staging pointed at.
      - name: The staged build, checked against what staging tested
        run: |
          gh release download "$STAGED_TAG" --repo "$GITHUB_REPOSITORY" -p images.json -p site.tar.gz -p staged.json
          if jq -e '.sha256["mobile.json"]' staged.json > /dev/null; then
            gh release download "$STAGED_TAG" --repo "$GITHUB_REPOSITORY" -p mobile.json
          fi
          jq . staged.json
          node .train/scripts/release/release.mjs verify-staged
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # :production is what the Mac mini pulls (macmini.sh pull): moving it is
      # the forecast worker's deployment.
      - name: Tag the digests :production, :latest and the release version
        run: |
          for name in forecast web market; do
            docker buildx imagetools create -t "${IMAGES}-${name}:production" -t "${IMAGES}-${name}:latest" \
              -t "${IMAGES}-${name}:${VERSION}" "$(jq -r ".images.$name" images.json)"
          done
      # The app: the production channel goes to the very branch staging ran,
      # once it is checked to still hold exactly those update groups (immutable,
      # so the same bytes). Binaries of the update's runtime get it on their next
      # launch; Production (app binaries) builds one if none exists.
      - id: app
        name: Is there an app to promote?
        env:
          MOBILE_JSON: mobile.json
        run: node .train/scripts/release/mobile.mjs gate staged.json
      - if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: npm ci
      - if: steps.app.outputs.run == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: The branch still holds exactly what staging ran
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          BRANCH: ${{ steps.app.outputs.branch }}
          UPDATE_GROUPS: ${{ steps.app.outputs.groups }}
          MOBILE_JSON: ../mobile.json
        run: |
          mkdir -p "$RUNNER_TEMP/eas"
          eas branch:view "$BRANCH" --json --non-interactive > "$RUNNER_TEMP/eas/branch.json"
          for group in $UPDATE_GROUPS; do eas update:view "$group" --json > "$RUNNER_TEMP/eas/group-$group.json"; done
          node ../.train/scripts/release/mobile.mjs verify-update "$RUNNER_TEMP/eas"
      - name: Point the production channel at it
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          BRANCH: ${{ steps.app.outputs.branch }}
        run: |
          eas channel:view production --json --non-interactive > /dev/null 2>&1 || eas channel:create production --non-interactive
          eas channel:edit production --branch "$BRANCH" --non-interactive
      # app/latest.json, for binaries too old for this update: the newest store
      # binary per platform (advertised once its review window has passed), the
      # runtimes production now serves, and MOBILE_MINIMUM_VERSION. It goes out
      # with the site (configure-site's moment: the same build, pointed at
      # production) and on the release.
      - id: latest
        name: app/latest.json
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          MOBILE_JSON: ../mobile.json
          # The App Store link; mobile/eas.json's production ascAppId when unset.
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          MOBILE_MINIMUM_VERSION: ${{ vars.MOBILE_MINIMUM_VERSION }}
          MOBILE_STORE_GRACE_HOURS: ${{ vars.MOBILE_STORE_GRACE_HOURS }}
        run: |
          for platform in ios android; do
            eas build:list --platform "$platform" --build-profile production --status finished --distribution store \
              --limit 50 --json --non-interactive > "$RUNNER_TEMP/production-$platform.json"
          done
          export BUILDS_JSON="$RUNNER_TEMP/production-ios.json,$RUNNER_TEMP/production-android.json"
          node ../.train/scripts/release/mobile.mjs latest-json ../latest.json
          node ../.train/scripts/release/mobile.mjs needs-build production
      - name: Deploy the site to production
        if: env.PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The checkout has its own site/ (the marketplace's users module), so the
          # build unpacks beside it, into pages/.
          mkdir pages && tar -xzf site.tar.gz -C pages
          node .train/scripts/release/release.mjs configure-site pages "${{ vars.PRODUCTION_FORECAST_BASE_URL }}"
          if [ -f latest.json ]; then mkdir -p pages/app && cp latest.json pages/app/latest.json; fi
          npx --yes wrangler@4 pages deploy pages --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$REF" --commit-message "${VERSION}"
      - name: Smoke the production site
        if: env.PAGES_PROJECT != ''
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_MANIFESTS: weather/harmonie.json,weather/gfs.json
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.smoke.config.ts
      - name: No app/latest.json on the site
        if: steps.app.outputs.run == 'true' && env.PAGES_PROJECT == ''
        run: echo "::notice title=App::CLOUDFLARE_PAGES_PROJECT is not set, so app/latest.json is on the release only, and older app binaries are not told about the store."
      - name: Release notes
        env:
          IMAGES_JSON: images.json
          MOBILE_JSON: mobile.json
        run: node .train/scripts/release/release.mjs notes release-notes.md
      - name: Publish the release
        run: |
          files=(images.json site.tar.gz staged.json)
          for file in mobile.json latest.json; do if [ -f "$file" ]; then files+=("$file"); fi; done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --latest \
            --title "wingfoil.ie ${VERSION}" --notes-file release-notes.md "${files[@]}"
      # Riders are told through the alerts API (in-app and push, its choice).
      # Never fails the promote: everything has shipped by now.
      - name: Tell riders
        if: steps.app.outputs.run == 'true'
        continue-on-error: true
        env:
          ALERTS_API_URL: ${{ vars.ALERTS_API_URL }}
          ALERTS_ADMIN_TOKEN: ${{ secrets.ALERTS_ADMIN_TOKEN }}
          NEEDS_STORE: ${{ steps.latest.outputs.platforms }}
        run: node .train/scripts/release/mobile.mjs announce
      - name: The app in production
        if: steps.app.outputs.run == 'true'
        env:
          BRANCH: ${{ steps.app.outputs.branch }}
          NEEDS_STORE: ${{ steps.latest.outputs.platforms }}
        run: |
          {
            echo "### The production app"
            echo
            echo "The \`production\` channel now serves EAS branch \`$BRANCH\`, the update staging ran. Production binaries with its runtime install it the next time riders leave the app."
            if [ -n "$NEEDS_STORE" ]; then echo "No production binary runs this runtime on: $NEEDS_STORE. *Production (app binaries)* builds and submits one; the update reaches riders on those platforms once the store has released it."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-report-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  # After production is out: a production binary for each platform that has
  # none running the promoted update's runtime (a native change since the last
  # store release), built from the same commit and submitted: App Store review,
  # and Google Play's production track as a draft (eas.json). Until a rider has
  # it, the over-the-air update cannot reach them; app/latest.json advertises
  # the new binary from the next promote, once its review window has passed.
  production-app:
    name: Production (app binaries)
    needs: [resolve, production]
    if: needs.resolve.outputs.channel == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
    permissions:
      contents: read
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      STAGED_TAG: ${{ needs.resolve.outputs.staged_tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/checkout@v7
        with:
          path: .train
          sparse-checkout: scripts/release
      - name: Keep the train and the working files out of what EAS uploads
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          mv .train "$RUNNER_TEMP/train"
          {
            echo "TRAIN=$RUNNER_TEMP/train/scripts/release"
            echo "W=$RUNNER_TEMP/app"
            echo "MOBILE_JSON=$RUNNER_TEMP/app/mobile.json"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: The staged app, checked against what staging recorded
        run: |
          gh release download "$STAGED_TAG" --repo "$GITHUB_REPOSITORY" -p staged.json -D "$W"
          if jq -e '.sha256["mobile.json"]' "$W/staged.json" > /dev/null; then
            gh release download "$STAGED_TAG" --repo "$GITHUB_REPOSITORY" -p mobile.json -D "$W"
            test "$(sha256sum "$W/mobile.json" | cut -d' ' -f1)" = "$(jq -r '.sha256["mobile.json"]' "$W/staged.json")"
          fi
      - id: app
        name: Is there an app to build?
        run: node "$TRAIN/mobile.mjs" gate "$W/staged.json"
      - if: steps.app.outputs.run == 'true'
        working-directory: mobile
        run: npm ci
      - if: steps.app.outputs.run == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - id: need
        name: Production binaries for its runtime
        if: steps.app.outputs.run == 'true'
        working-directory: mobile
        env:
          IOS_RUNTIME: ${{ steps.app.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ steps.app.outputs.android_runtime }}
        run: |
          eas build:list --platform ios --runtime-version "$IOS_RUNTIME" --build-profile production --status finished \
            --limit 50 --json --non-interactive > "$W/builds-ios.json"
          eas build:list --platform android --runtime-version "$ANDROID_RUNTIME" --build-profile production --status finished \
            --limit 50 --json --non-interactive > "$W/builds-android.json"
          BUILDS_JSON="$W/builds-ios.json,$W/builds-android.json" CHECK_SUBMIT=true node "$TRAIN/mobile.mjs" needs-build production
      - name: Build and submit the production app (App Store review, Google Play)
        if: steps.app.outputs.run == 'true' && steps.need.outputs.eas_platform != ''
        working-directory: mobile
        env:
          PLATFORM: ${{ steps.need.outputs.eas_platform }}
        run: |
          eas build --profile production --platform "$PLATFORM" --auto-submit --non-interactive --wait --json \
            --message "v$VERSION (${REF:0:12})" > "$W/built.json"
          node "$TRAIN/mobile.mjs" check-built "$W/built.json"
      - name: Summary
        if: steps.app.outputs.run == 'true'
        env:
          NEEDED: ${{ steps.need.outputs.platforms }}
        run: |
          {
            echo "### Production app binaries"
            echo
            if [ -z "$NEEDED" ]; then
              echo "Every platform already has a production binary for this runtime: nothing to build."
            else
              echo "Built and submitted for: $NEEDED. Release them in App Store Connect and the Play Console once review passes; the over-the-air update reaches only binaries of this runtime."
              jq -r '.[] | "- \(.platform | ascii_downcase): \(.appVersion) (\(.appBuildVersion)), runtime `\((.runtime.version // "")[0:12])`, build \(.id)"' "$W/built.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
