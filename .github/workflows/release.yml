name: Release

# Main feeds a nightly train; a release promotes what a nightly already built,
# through staging and then production. docs/RELEASES.md walks through it.
#
#   schedule (02:17 UTC)   a nightly of main's head, but only when main has commits
#                          the last nightly did not build. A main that no longer
#                          contains the last nightly (history rewritten) FAILS the
#                          resolve step rather than skipping quietly.
#   dispatch nightly       a nightly of main's head now, gate skipped
#   dispatch release       promote the latest nightly (or the one named):
#                          the SAME image digests and the SAME site build, never
#                          a rebuild -- staging, its tests, an approval, production
#
# A nightly builds the three images (forecast worker, site, marketplace API) and
# the static site once, runs the whole CI gate against the commit, smoke-tests
# each image, then runs acceptance: the worker fetches real HARMONIE and GFS
# runs, publishes them to an S3-compatible bucket, and the site image draws them
# in a browser. Only then is anything published: a prerelease v<date>-nightly.<run>
# carrying images.json (the digests) and the site, and the images' :nightly tag.
#
# Nothing else here deploys. Production today is the forecast worker, which the
# Mac mini runs by pulling :production (deploy/home-compute/macmini.sh pull); the
# site goes to Cloudflare Pages too once the repository variables in
# docs/RELEASES.md exist, and is skipped with a notice until then.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "nightly builds main now; release promotes a nightly through staging to production"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release
      nightly:
        description: "release only: the nightly tag to promote (default: the newest)"
        required: false
        default: ""
        type: string

# Two queues, neither cancelling: a cancelled release can leave a half-moved tag.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGES: ghcr.io/${{ github.repository_owner }}/wingfoil

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      nightly_tag: ${{ steps.resolve.outputs.nightly_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A shut gate ends the run here, green, with should_build=false; a refusal
      # (main rewritten under the last nightly, a commit already released) exits
      # non-zero, so it is seen. scripts/release/release.mjs has the rules.
      - id: resolve
        name: Channel, version and commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_NIGHTLY: ${{ inputs.nightly }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/release/release.mjs resolve

  # ---------------------------------------------------------------- nightly ---

  quality:
    name: Quality gate
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      release_gate: true

  images:
    name: Image (${{ matrix.name }})
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: forecast
            file: force5/Dockerfile
          - name: web
            file: deploy/local/Dockerfile.web
          - name: market
            file: market/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      # What deploy/home-compute/panel.py compares to say whether the image the
      # Mac mini runs matches a checkout.
      - id: hash
        name: Source hash
        run: echo "value=$(python3 -I deploy/home-compute/panel.py source-hash)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed under the run's own tags only; :nightly moves in the publish job,
      # after every gate, so it never names an image that failed one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGES }}-${{ matrix.name }}:${{ needs.resolve.outputs.version }}
            ${{ env.IMAGES }}-${{ matrix.name }}:sha-${{ needs.resolve.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.ref }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            wingfoil.source-hash=${{ steps.hash.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${IMAGES}-${{ matrix.name }}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7

  # One static build for every environment: release.mjs configure-site points it
  # at an environment's forecast data at deploy time.
  site:
    name: Site build
    needs: resolve
    if: needs.resolve.outputs.channel == 'nightly' && needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -czf site.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  acceptance:
    name: Acceptance (images, real forecasts)
    needs: [resolve, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Pull the pushed images
        run: for name in forecast web market; do docker pull -q "$(cat "digests/$name")"; done
      - name: Worker image smoke
        run: scripts/release/worker-image-smoke.sh "$(cat digests/forecast)"
      - name: Site image smoke
        run: scripts/release/web-image-smoke.sh "$(cat digests/web)"
      - name: Marketplace API image smoke
        run: scripts/release/market-image-smoke.sh "$(cat digests/market)"
      - name: Real forecasts, a bucket and a browser
        run: scripts/release/acceptance.sh "$(cat digests/forecast)" "$(cat digests/web)"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-report-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  publish:
    name: Publish nightly
    needs: [resolve, quality, images, site, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@v8
        with:
          name: site
      - name: images.json
        run: |
          jq -n --arg version "$VERSION" --arg commit "$REF" \
            --arg forecast "$(cat digests/forecast)" --arg web "$(cat digests/web)" --arg market "$(cat digests/market)" \
            '{version: $version, commit: $commit, images: {forecast: $forecast, web: $web, market: $market}}' > images.json
          cat images.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move :nightly to these digests
        run: |
          for name in forecast web market; do
            docker buildx imagetools create -t "${IMAGES}-${name}:nightly" "$(cat "digests/$name")"
          done
      - name: Release notes
        env:
          IMAGES_JSON: images.json
        run: node scripts/release/release.mjs notes release-notes.md
      # --target creates the tag on the commit that was built, not on wherever
      # main has moved since.
      - name: Publish the prerelease
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --prerelease --latest=false \
            --title "Nightly ${VERSION}" --notes-file release-notes.md images.json site.tar.gz
      # A failure here leaves the nightly it follows published, so it does not fail the job.
      - name: Delete the older nightly releases (their tags stay)
        continue-on-error: true
        run: node scripts/release/release.mjs prune-nightlies 7

  # ---------------------------------------------------------------- release ---

  # The promoted digests get :staging, and the tests run against exactly them:
  # every image smoke and the real-forecast acceptance again (today's providers,
  # not the night's), then -- once Cloudflare is configured -- the site deployed
  # to the staging branch and the smoke suite against it.
  staging:
    name: Staging
    needs: resolve
    if: needs.resolve.outputs.channel == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: ${{ vars.STAGING_SITE_URL }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly_tag }}
      GH_TOKEN: ${{ github.token }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The nightly's images and site
        run: |
          gh release download "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" -p images.json -p site.tar.gz
          jq . images.json
          test "$(jq -r .commit images.json)" = "${{ needs.resolve.outputs.ref }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the digests :staging and the release version
        run: |
          for name in forecast web market; do
            digest="$(jq -r ".images.$name" images.json)"
            docker buildx imagetools create -t "${IMAGES}-${name}:staging" -t "${IMAGES}-${name}:${VERSION}" "$digest"
          done
      - name: Pull them
        run: for name in forecast web market; do docker pull -q "$(jq -r ".images.$name" images.json)"; done
      - name: Image smoke
        run: |
          scripts/release/worker-image-smoke.sh "$(jq -r .images.forecast images.json)"
          scripts/release/web-image-smoke.sh "$(jq -r .images.web images.json)"
          scripts/release/market-image-smoke.sh "$(jq -r .images.market images.json)"
      - name: Real forecasts, a bucket and a browser
        run: scripts/release/acceptance.sh "$(jq -r .images.forecast images.json)" "$(jq -r .images.web images.json)"
      - name: Deploy the site to staging
        if: env.PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir site && tar -xzf site.tar.gz -C site
          node scripts/release/release.mjs configure-site site "${{ vars.STAGING_FORECAST_BASE_URL }}"
          npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" --branch staging \
            --commit-hash "${{ needs.resolve.outputs.ref }}" --commit-message "${VERSION} (staging)"
      - name: Smoke the staging site
        if: env.PAGES_PROJECT != ''
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_SITE_URL }}
          SMOKE_MANIFESTS: weather/harmonie.json,weather/gfs.json
        run: npx playwright test -c playwright.smoke.config.ts
      - name: No site deployment configured
        if: env.PAGES_PROJECT == ''
        run: echo "::notice::CLOUDFLARE_PAGES_PROJECT is not set, so no site was deployed to staging. docs/RELEASES.md says how to set it up."
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-report-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report
            test-results

  # Waits for the production environment's required reviewer: the one click.
  production:
    name: Production
    needs: [resolve, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      REF: ${{ needs.resolve.outputs.ref }}
      NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly_tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The nightly's images and site
        run: gh release download "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" -p images.json -p site.tar.gz
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # :production is what the Mac mini pulls (macmini.sh pull): moving it is
      # the forecast worker's deployment.
      - name: Tag the digests :production and :latest
        run: |
          for name in forecast web market; do
            docker buildx imagetools create -t "${IMAGES}-${name}:production" -t "${IMAGES}-${name}:latest" \
              "$(jq -r ".images.$name" images.json)"
          done
      - name: Deploy the site to production
        if: env.PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir site && tar -xzf site.tar.gz -C site
          node scripts/release/release.mjs configure-site site "${{ vars.PRODUCTION_FORECAST_BASE_URL }}"
          npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$REF" --commit-message "${VERSION}"
      - name: Smoke the production site
        if: env.PAGES_PROJECT != ''
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          SMOKE_MANIFESTS: weather/harmonie.json,weather/gfs.json
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.smoke.config.ts
      - name: Release notes
        env:
          IMAGES_JSON: images.json
        run: node scripts/release/release.mjs notes release-notes.md
      - name: Publish the release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --latest \
            --title "wingfoil.ie ${VERSION}" --notes-file release-notes.md images.json site.tar.gz
