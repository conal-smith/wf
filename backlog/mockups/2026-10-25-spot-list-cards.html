<!doctype html>
<html lang="en-IE">
<head>
<meta charset="UTF-8">

<title>Mock-up · Spots, the list's cards</title>
<!--
  A design exploration, not product code. Standalone; faces from node_modules.
  Satellite is Esri's World Imagery, fetched live; it needs a connection.

  The owner's steer (25 October 2026), after 2026-10-25-spot-finder-ideas.html:
    - a page of its own, not on the chart and not tied to it: press a card's
      picture for the chart, anywhere else on the card for the spot page;
    - no Best and Now lines, no reasons in words: the picture, then today,
      then the next five days (today not among them);
    - stars as colour along the time, and what is missing today: the wind's
      direction, the weather, the waves, the tide;
    - two columns on a desktop.
  Four ways to draw a card, on one made-up Dublin week:
    1  Ribbons    today and each day as a ribbon coloured by stars, arrows
                  and the sky above it, the waves and the air beside
    2  Bars       the wind as bars coloured by stars, the gust a faint dotted
                  line over them, the tide behind
    3  One chart  today and the five days on one chart: the wind's line with
                  the area under it coloured by stars, the gust dotted, the
                  tide behind, the sky and the arrows along it
    4  Day tiles  six tiles, one a day: the sky, the air, the wind and its
                  way, the waves, and the day's stars as a ribbon
  ?design=1..4  ?device=phone  ?colour=ink
-->
<style>
@font-face { font-family: "Fraunces Variable"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2") format("woff2"); }
@font-face { font-family: "Newsreader Variable"; font-style: normal; font-display: swap; font-weight: 200 800;
  src: url("../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-display: swap; font-weight: 500;
  src: url("../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-display: swap; font-weight: 600;
  src: url("../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); }

:root {
  --ground: #f3eee3; --paper: #fffdf6; --ink: #1a1d21; --ink-2: #3b3c3e; --muted: #5b5c5b; --line: #1a1d2133;
  --pen: #d43a2c; --pen-ink: #bf3125; --magenta: #b0186a; --sea: #8fb8d6;
  --display: "Fraunces Variable", Fraunces, Georgia, serif;
  --body: "Newsreader Variable", Newsreader, Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --edge: inset 0 0 0 2px #f4efe5, inset 0 0 0 3px #1a1d2142;
  --float: var(--edge), 0 1px 1px #1a1d211a, 0 3px 6px -2px #1a1d211f, 0 14px 28px -12px #3c2d1466;
  --card: var(--edge), 0 1px 1px #1a1d211a, 0 2px 4px -2px #1a1d211a;
  --press: linear-gradient(180deg, #33373d, #15171a);
  --hatch: repeating-linear-gradient(135deg, #1a1d2114 0 2px, transparent 2px 5px);
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 14px; }
body { margin: 0; background: #d9d4c7; color: var(--ink); font-family: var(--body); line-height: 1.35; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.mockbar { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; background: #1a1d21; color: #f3eee3; font: 500 11px var(--mono); letter-spacing: .08em; }
.mockbar b { margin-right: 10px; text-transform: uppercase; letter-spacing: .14em; }
.mockbar .gap { width: 14px; }
.mockbar button { background: none; border: 1px solid #f3eee355; border-radius: 99px; padding: 3px 10px; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.mockbar button[aria-pressed=true] { background: #f3eee3; color: #1a1d21; }
.stage { display: flex; justify-content: center; padding: 24px 16px 32px; }
.frame { background: var(--ground); position: relative; overflow: hidden; box-shadow: 0 20px 50px -20px #0007, 0 0 0 1px #1a1d2133; }
.frame.desk { width: 1280px; height: 900px; border-radius: 10px; }
.frame.phone { width: 390px; height: 844px; border-radius: 28px; }

.app { height: 100%; display: flex; flex-direction: column; position: relative; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 3px double var(--ink); background: var(--ground); }
.word { font: 800 21px/1 var(--display); letter-spacing: -.03em; }

.burger { width: 36px; height: 36px; flex: none; border: 1.5px solid var(--ink); border-radius: 99px; display: grid; place-items: center; background: linear-gradient(180deg, #fff, #f0eadd); box-shadow: inset 0 1px 0 #fff, 0 1px 2px #1a1d2126; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 99px; padding: 2px; background: var(--paper); flex: none; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 4px 12px; font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.seg button[aria-pressed=true] { color: var(--ground); background: var(--press); }
.list { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 40px; }

.lhead h2 { font: 700 22px/1.1 var(--display); letter-spacing: -.02em; }
.lhead .sp { flex: 1; }
.key { display: inline-flex; align-items: center; gap: 6px; font: 500 10px var(--mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.phone .grid { grid-template-columns: minmax(0, 1fr); }
.card { min-width: 0; }
.phone .sec .lg { display: none; }

/* ---- the card ----------------------------------------------------------- */
.card { position: relative; padding: 10px 12px 12px; border-radius: 18px; background: var(--paper); border: 1px solid #1a1d2155; box-shadow: var(--card); cursor: pointer; transition: box-shadow .12s, transform .12s; }
.card:hover { box-shadow: var(--float); transform: translateY(-1px); }
.head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.sat { position: relative; flex: none; width: 112px; aspect-ratio: 16 / 10; border-radius: 11px; overflow: hidden; border: 1px solid var(--ink); background: #33403f; padding: 0; }
.sat .tiles { position: absolute; left: 0; top: 0; }
.sat .tiles img { position: absolute; width: 256px; height: 256px; filter: saturate(.8) brightness(1.03); }
.sat > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sat:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.sat .go { position: absolute; left: 5px; bottom: 5px; padding: 1px 6px; border-radius: 99px; background: #1a1d21cc; color: #f3eee3; font: 500 8.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: 0; transition: opacity .12s; }
.sat:hover .go { opacity: 1; }
.head .nm { flex: 1; min-width: 0; }
.head b { display: block; font: 600 18px/1.15 var(--display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head small { font: 500 11px var(--mono); color: var(--muted); }
.fav { flex: none; align-self: flex-start; width: 30px; height: 30px; border-radius: 99px; border: 1px solid var(--ink); display: grid; place-items: center; background: linear-gradient(180deg, #fff, #f0eadd); padding: 0; }
.sec { font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 1px 3px; }
.sec .r { display: inline-flex; gap: 10px; align-items: center; font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: 11px; color: var(--ink-2); }
.sec .r span { display: inline-flex; align-items: center; gap: 3px; }
.ribbon { position: relative; height: 14px; border-radius: 99px; box-shadow: inset 0 0 0 1px #1a1d2133; overflow: hidden; }
.ribbon .past { position: absolute; left: 0; top: 0; bottom: 0; background: #fffdf6b3; }
.nowm { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--pen); border-radius: 2px; box-shadow: 0 0 0 1px var(--paper); z-index: 2; }
.row { display: flex; position: relative; height: 16px; }
.row > * { position: absolute; transform: translateX(-50%); top: 0; }
.ticks { position: relative; height: 12px; font: 500 9px var(--mono); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); top: 1px; }
.mt { margin-top: 10px; }
.days5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.dcol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dcol .dh { display: flex; justify-content: space-between; align-items: baseline; font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.dcol .dh small { font-weight: 600; display: inline-flex; align-items: center; gap: 1px; }
.dcol .dw { display: flex; align-items: center; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--ink-2); white-space: nowrap; }
.dcol .dw span { display: inline-flex; align-items: center; gap: 2px; }
.dcol .ribbon { height: 10px; border-radius: 5px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.tiles6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.phone .tiles6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { border-radius: 12px; border: 1px solid #1a1d2140; background: var(--ground); padding: 6px 7px 7px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile.today { border-color: var(--ink); background: var(--paper); }
.tile .dh { display: flex; justify-content: space-between; align-items: center; font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.tile .dh small { display: inline-flex; align-items: center; gap: 1px; font-weight: 600; }
.tile .sky { display: flex; align-items: center; gap: 5px; font: 600 13px var(--mono); }
.tile .kn { display: flex; align-items: center; gap: 3px; font: 600 12.5px var(--mono); white-space: nowrap; }
.tile .kn small { font-weight: 500; color: var(--muted); font-size: 10px; }
.tile .wv { font: 500 10.5px var(--mono); color: var(--ink-2); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.tile .ribbon { height: 8px; border-radius: 4px; margin-top: 2px; }
.hours { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.hr { flex: 1 0 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 5px; border-radius: 9px; background: var(--ground); border: 1px solid #1a1d2122; font-family: var(--mono); }
.hr small { font: 500 9px var(--mono); color: var(--muted); }
.hr b { font: 600 13px var(--mono); line-height: 1; }
.hr .bar { width: 70%; height: 5px; border-radius: 3px; }
.hr .st { height: 12px; display: grid; place-items: center; }
.hr .st i { width: 3px; height: 3px; border-radius: 99px; background: #1a1d2140; }
.hr.gone { opacity: .45; }
.hr.now { border-color: var(--pen); box-shadow: inset 0 0 0 1px var(--pen); }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 99px; background: var(--press); color: var(--ground); font: 500 11px var(--mono); letter-spacing: .06em; box-shadow: 0 8px 20px -6px #000a; white-space: nowrap; }
.phone .top { padding: 10px 12px; }
.phone .list { padding: 10px 10px 80px; }
.phone .lhead h2 { font-size: 19px; }
.phone .sat { width: 96px; }
.phone .days5 { gap: 4px; }
.phone .dcol .dw { font-size: 9.5px; }
</style>

<body>
<div class="mockbar"><b>Mock-up · Spot cards</b>
  <button data-design="7a">7a · Today on top</button><button data-design="7b">7b · Today zoomed in</button><button data-design="7c">7c · Today by the hour</button>
  <span class="gap"></span><button data-design="6d">6d · Star a day (before)</button>
  <span class="gap"></span><button data-device="desk">Desktop</button><button data-device="phone">Phone</button>
  <span class="gap"></span><button data-colour="pink">Stars: pink</button><button data-colour="gold">Stars: gold → purple</button>
</div>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="why" id="why"></div>
<script>
/* ---- the wind's colours (force5/src/weather.ts PALETTE), as the chart and its blend draw speed ---- */
const WIND = [[0, [170, 203, 234]], [5, [128, 174, 224]], [9, [79, 128, 200]], [10, [73, 168, 138]], [15, [76, 179, 90]], [20, [111, 191, 62]],
  [25, [181, 207, 58]], [30, [236, 210, 58]], [35, [242, 160, 58]], [40, [224, 90, 51]], [45, [200, 48, 74]], [50, [155, 47, 134]], [60, [90, 35, 104]], [65, [35, 22, 40]]];
function windCss(kn) {
  const k = Math.max(0, Math.min(65, kn)); let i = 1;
  while (i < WIND.length - 1 && k > WIND[i][0]) i++;
  const [a, ca] = WIND[i - 1], [b, cb] = WIND[i];
  return `rgb(${ca.map((v, c) => Math.round(v + (cb[c] - v) * (k - a) / (b - a))).join(",")})`;
}

/* ---- stars as colour ----------------------------------------------------- */
// The stars get colours of their own, never the wind's (the wind's colours mean knots).
// Each scale is one hue, light to dark, checked with the data-viz ordinal validator
// against the card's paper (#fffdf6): monotone lightness, visible steps, and the
// one-star end at 2:1 or better. No stars is a plain grey, not a colour.
const PALETTES = {
  pink: ["#e28bb3", "#d2609a", "#bd3d84", "#a01f6c", "#7c0f55"],     // the chart's magenta, paled and deepened
  gold: ["#e9a03a", "#e0708a", "#c94a8a", "#a32a80", "#742274"],     // gold through pink to purple
  green: ["#ece3b0", "#cfe08f", "#93cc76", "#4fa96a", "#20805b"],    // the first mock-up's, to compare
};
const NONE = "#ddd7ca";
const starFill = (n) => n <= 0 ? NONE : PALETTES[S.colour][Math.min(5, n) - 1];

/* ---- the week: today is Sunday 25 October, 13:00 --------------------------- */
const NOW = 13, LIGHT_FROM = 7, LIGHT_TO = 18;   // daylight 07:00–18:00 (sunset ~17:00, usable to ~17:40)
const DAYS = [
  { name: "Today", short: "Sun", from: 250, kn: [16, 19, 17], gf: 2.05, sky: ["showers", "showers", "partly", "partly"], air: [9, 11, 12, 11], wave: [.3, 4] },
  { name: "Mon", short: "Mon", from: 135, kn: [9, 15, 12], gf: 1.45, sky: ["cloudy", "partly", "clear", "clear"], air: [8, 12, 13, 11], wave: [.8, 6] },
  { name: "Tue", short: "Tue", from: 95, kn: [17, 24, 20], gf: 1.45, sky: ["rain", "rain", "showers", "cloudy"], air: [10, 11, 12, 11], wave: [1.7, 7] },
  { name: "Wed", short: "Wed", from: 185, kn: [7, 12, 9], gf: 1.3, sky: ["fog", "cloudy", "partly", "partly"], air: [9, 13, 14, 12], wave: [.5, 5] },
  { name: "Thu", short: "Thu", from: 45, kn: [11, 16, 13], gf: 1.35, sky: ["partly", "clear", "clear", "partly"], air: [6, 9, 10, 8], wave: [1.1, 6] },
  { name: "Fri", short: "Fri", from: 300, kn: [13, 18, 15], gf: 1.6, sky: ["showers", "showers", "partly", "showers"], air: [7, 9, 9, 8], wave: [.4, 4] },
];
const meanAt = (d, h) => { const [m, p, e] = DAYS[d].kn; if (h <= 7) return m * .92; if (h >= 19) return e * .92;
  return h <= 13 ? m + (p - m) * Math.sin((h - 7) / 6 * Math.PI / 2) : p + (e - p) * ((h - 13) / 6); };
// Today a front clears through the afternoon: the wind backs from the west (off the east coast) to the south-east
// and the gusts ease, so the hours from about 14:00 come good.
const fromAt = (d, h) => (d === 0 && h > 13 ? DAYS[0].from - (h - 13) * 24 : DAYS[d].from + (h - 12) * 2.5 + 360) % 360;
const gfAt = (d, h) => d === 0 && h > 13 ? Math.max(1.35, DAYS[0].gf - (h - 13) * .2) : DAYS[d].gf;
const skyAt = (d, h) => DAYS[d].sky[Math.max(0, Math.min(3, Math.floor((h - 6) / 3)))];
const airAt = (d, h) => DAYS[d].air[Math.max(0, Math.min(3, Math.floor((h - 6) / 3)))];
// Dublin's tide: high water 10:40 today, 12 h 25 min a cycle, 0.6–4.0 m.
const tideAt = (d, h) => 2.3 + 1.7 * Math.cos(2 * Math.PI * (d * 24 + h - 10.67) / 12.42);

/* ---- the spots ------------------------------------------------------------- */
const HOME = [53.365, -6.2];
const SPOTS = [
  ["dollymount", "Dollymount Strand", "Dublin", 53.367, -6.145, 125, 1.0, .8], ["velvet", "Portmarnock, Velvet Strand", "Dublin", 53.418, -6.125, 95, 1.05, 1],
  ["malahide", "Malahide Estuary", "Dublin", 53.452, -6.165, 70, .85, .15], ["sandymount", "Sandymount", "Dublin", 53.33, -6.205, 95, .9, .4],
  ["skerries", "Skerries, South Strand", "Dublin", 53.578, -6.104, 100, 1.05, 1], ["bray", "Bray", "Wicklow", 53.2, -6.095, 95, 1.0, 1],
  ["killiney", "Killiney", "Dublin", 53.258, -6.11, 100, 1.0, .9], ["greystones", "Greystones", "Wicklow", 53.145, -6.06, 100, 1.05, 1],
].map(([id, name, county, lat, lon, facing, open, sea]) => ({ id, name, county, lat, lon, facing, open, sea,
  km: Math.round(Math.hypot((lat - HOME[0]) * 111, (lon - HOME[1]) * 111 * Math.cos(53.4 * Math.PI / 180))) }));

/* ---- the stars (stars.ts for "Riding · ~80 kg": 11 / 14–24 / gusts to 34) ---- */
const BAND = [11, 14, 24, 34];
const angleOff = (from, facing) => Math.abs(((from - facing) % 360 + 540) % 360 - 180);
const shoreOf = (off) => off < 30 ? "on" : off < 70 ? "x-on" : off < 110 ? "cross" : off < 150 ? "x-off" : "off";
const COST = { on: 0, "x-on": 0, cross: 0, "x-off": 1.5, off: 5 };
function rate(spot, d, h) {
  const mean = meanAt(d, h) * spot.open, gust = mean * gfAt(d, h), from = fromAt(d, h), [lo, sLo, sHi, top] = BAND;
  const shore = shoreOf(angleOff(from, spot.facing)), light = h >= LIGHT_FROM && h <= LIGHT_TO - 1;
  let pot = mean < lo ? 0 : mean < sLo ? 1 + 3 * (mean - lo) / (sLo - lo) : mean <= sHi ? 5 : 4;
  if (gust > top) pot = 0;
  return { mean, gust, from, shore, light, stars: light ? Math.max(0, Math.round(pot - COST[shore])) : 0 };
}
const dayMax = (spot, d) => Math.max(0, ...hours(d).filter((h) => d || h >= NOW).map((h) => rate(spot, d, h).stars));
const wave = (spot, d) => ({ m: Math.round(DAYS[d].wave[0] * spot.sea * 10) / 10, s: DAYS[d].wave[1] });
function hours(d) { const a = []; for (let h = LIGHT_FROM; h < LIGHT_TO; h++) a.push(h); return a; }

/* ---- state ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const S = { design: params.get("design") || "7a", device: params.get("device") || "desk", colour: params.get("colour") || "pink",
  scope: "near", sort: "today", starred: new Set(["velvet", "dollymount", "malahide", "skerries", "bray"]), toast: null };

/* ---- glyphs -------------------------------------------------------------------- */
const px = (lat, lon, z) => { const n = 2 ** z * 256, r = lat * Math.PI / 180; return [(lon + 180) / 360 * n, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n]; };
function satTiles(lat, lon, z, w, h) {
  const [cx, cy] = px(lat, lon, z), ox = cx - w / 2, oy = cy - h / 2; let s = "";
  for (let x = Math.floor(ox / 256); x <= Math.floor((ox + w) / 256); x++) for (let y = Math.floor(oy / 256); y <= Math.floor((oy + h) / 256); y++)
    s += `<img alt="" loading="lazy" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}" style="left:${x * 256 - ox}px;top:${y * 256 - oy}px">`;
  return `<div class="tiles">${s}</div>`;
}
function rose(spot, from, w, h) {
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.3, up = 70, reach = 120;
  const p = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const sector = (a1, a2, r) => { const [x1, y1] = p(a1, r), [x2, y2] = p(a2, r); return `M${cx} ${cy}L${x1} ${y1}A${r} ${r} 0 ${((a2 - a1) % 360 + 360) % 360 > 180 ? 1 : 0} 1 ${x2} ${y2}Z`; };
  const off = (spot.facing + 180) % 360, arc = (a1, a2, r) => { const [x1, y1] = p(a1, r), [x2, y2] = p(a2, r); return `M${x1} ${y1}A${r} ${r} 0 0 1 ${x2} ${y2}`; };
  const [nx, ny] = p(from, R + 11), [tx, ty] = p(from, R + 1);

// opt.days: which days (today is 0); opt.todayFrom: today's first hour; opt.todayScale: how much wider today's hours are;
// opt.todayHourly: today's knots and arrows every hour, and a star on each rated hour.
function windBand(spot, mode, opt = {}) {
  const phone = S.device === "phone", W = phone ? 344 : 580, gap = 7, days = opt.days || [0, 1, 2, 3, 4, 5];
  const row = mode === "row", win = mode === "window", extra = opt.todayHourly ? 12 : 0;
  const H = (row ? 146 : win ? 156 : 140) + extra, top = row ? 50 : win ? 62 : 46, base = H - 34 - extra, kmax = 45;
  const segs = days.map((d) => ({ d, from: d ? LIGHT_FROM : opt.todayFrom ?? NOW, k: d ? 1 : opt.todayScale ?? 1 }));
  const room = (sg) => Math.max((LIGHT_TO - sg.from) * sg.k, sg.d ? 0 : 7);
  const total = segs.reduce((n, sg) => n + room(sg), 0), unit = (W - gap * (segs.length - 1)) / total;
  const y = (kn) => base - Math.min(kn, kmax) / kmax * (base - top);
  let x = 0, g = "", defs = "";
  // faint guides at 10, 20 and 30 knots, named in the room left of today's first hour
  const roomLeft = room(segs[0]) - (LIGHT_TO - segs[0].from) * segs[0].k > 1.5;
  [10, 20, 30].forEach((k) => g += `<line x1="0" x2="${W}" y1="${y(k)}" y2="${y(k)}" stroke="#1a1d21" stroke-opacity=".08"/>${roomLeft ? `<text x="0" y="${y(k) + 3}" font-size="8" font-family="IBM Plex Mono" fill="#5b5c5b" fill-opacity=".85">${k}</text>` : ""}`);
  segs.forEach((seg, k) => {
    const { d, from } = seg, n = LIGHT_TO - from, uw = unit * seg.k, sx = x, sw = room(seg) * unit, lead = sw - n * uw, hs = []; for (let h = from; h < LIGHT_TO; h++) hs.push(h);
    const X = (h) => sx + lead + (h - from) * uw, run = bestRun(spot, d, hs.filter((h) => d || h >= NOW)) || (d ? null : null);
    const hourly = !d && opt.todayHourly;
    g += `<text x="${sx + 1}" y="11" font-size="9.5" font-weight="600" font-family="IBM Plex Mono" letter-spacing=".6">${d ? DAYS[d].short.toUpperCase() : "TODAY"}</text>`;
    if (mode === "day" && run) g += starAt(sx + (d ? 30 : 46), 7.5, 10, starFill(run.top)) + `<text x="${sx + (d ? 37 : 53)}" y="11" font-size="9.5" font-weight="600" font-family="IBM Plex Mono">${run.top}</text>`;
    g += skyG(skyAt(d, Math.max(from, 13)), sx + 8, 24, 15) + `<text x="${sx + 18}" y="28" font-size="10" font-family="IBM Plex Mono" fill="#3b3c3e">${airAt(d, 13)}°</text>`;
    // the band: the mean wind filled in its own colour, hour by hour; the gusts a paler layer over it, in theirs
    const id = `wb${spot.id}${d}`, stops = (f, o) => hs.map((h, i) => `<stop offset="${((i + .5) / n).toFixed(3)}" stop-color="${windCss(f(h))}" stop-opacity="${o}"/>`).join("");
    defs += `<linearGradient id="${id}m" x1="${sx + lead}" x2="${sx + sw}" gradientUnits="userSpaceOnUse">${stops((h) => rate(spot, d, h).mean, 1)}</linearGradient>`;
    defs += `<linearGradient id="${id}g" x1="${sx + lead}" x2="${sx + sw}" gradientUnits="userSpaceOnUse">${stops((h) => rate(spot, d, h).gust, .5)}</linearGradient>`;
    const pts = (f) => [[sx + lead, f(hs[0])], ...hs.map((h) => [X(h) + uw / 2, f(h)]), [sx + sw, f(hs[hs.length - 1])]];
    const path = (f) => pts(f).map(([a, b]) => `${a.toFixed(1)} ${b.toFixed(1)}`).join("L");
    const mean = (h) => y(rate(spot, d, h).mean), gust = (h) => y(rate(spot, d, h).gust);
    const meanR = pts(mean).slice().reverse().map(([a, b]) => `${a.toFixed(1)} ${b.toFixed(1)}`).join("L");
    g += `<path d="M${path(gust)}L${meanR}Z" fill="url(#${id}g)"/>`;
    g += `<path d="M${sx + lead} ${base}L${path(mean)}L${sx + sw} ${base}Z" fill="url(#${id}m)"/>`;
    g += `<path d="M${path(gust)}" fill="none" stroke="#1a1d21" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 2"/>`;
    g += `<path d="M${path(mean)}" fill="none" stroke="#1a1d21" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>`;
    g += `<line x1="${sx + lead}" x2="${sx + sw}" y1="${base + .5}" y2="${base + .5}" stroke="#1a1d2166"/>`;
    // the windiest hour, in numbers: the wind and its gust
    const pk = hs.reduce((a, h) => rate(spot, d, h).mean > rate(spot, d, a).mean ? h : a, hs[0]), pr = rate(spot, d, pk);
    const lx = Math.min(sx + sw - 18, Math.max(sx + lead + 18, X(pk) + uw / 2));
    if (mode !== "top" || !run) g += `<text x="${lx}" y="${Math.max(top - 4, y(pr.gust) - 4)}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono"><tspan font-weight="600">${Math.round(pr.mean)}</tspan><tspan fill="#5b5c5b" font-size="8.5"> g${Math.round(pr.gust)}</tspan></text>`;
    // the stars, four ways
    const ss = Math.max(5, Math.min(hourly ? 10 : 9, uw * .95));
    if (hourly) hs.forEach((h) => { const r = rate(spot, d, h); if (r.stars && h >= NOW) g += starAt(X(h) + uw / 2, y(r.gust) - ss / 2 - 3, ss, starFill(r.stars)); });
    if (hourly) hs.forEach((h) => { const r = rate(spot, d, h); g += `<text x="${X(h) + uw / 2}" y="${base + 24}" text-anchor="middle" font-size="9" font-weight="600" font-family="IBM Plex Mono" opacity="${h < NOW ? .45 : 1}">${Math.round(r.mean)}</text>`; });
    if (mode === "top") hs.forEach((h) => { const r = rate(spot, d, h); if (r.stars) g += starAt(X(h) + uw / 2, y(r.gust) - ss / 2 - 2, ss, starFill(r.stars)); });
    if (mode === "row") { g += `<line x1="${sx + lead}" x2="${sx + sw}" y1="40.5" y2="40.5" stroke="#1a1d21" stroke-opacity=".1"/>`;
      hs.forEach((h) => { const r = rate(spot, d, h); g += r.stars ? starAt(X(h) + uw / 2, 40, ss, starFill(r.stars)) : `<circle cx="${X(h) + uw / 2}" cy="40.5" r="1" fill="#1a1d21" fill-opacity=".18"/>`; }); }
    if (mode === "window" && run) { const a = X(run.from) + 1, b = X(run.to) + uw - 1, yy = 48;
      g += `<path d="M${a} ${yy + 4}V${yy}H${b}V${yy + 4}" fill="none" stroke="${starFill(run.top)}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
      const cx = Math.max(sx + 14, Math.min(sx + sw - 14, (a + b) / 2)); g += `<rect x="${cx - 13}" y="${yy - 13}" width="26" height="12" rx="6" fill="#fffdf6" stroke="${starFill(run.top)}" stroke-width="1.2"/>` + starAt(cx - 5, yy - 7, 8, starFill(run.top)) + `<text x="${cx + 5}" y="${yy - 3.5}" text-anchor="middle" font-size="9" font-weight="600" font-family="IBM Plex Mono">${run.top}</text>`; }
    if (mode === "day" && run) g += `<line x1="${X(run.from) + 1}" x2="${X(run.to) + uw - 1}" y1="${base + 3}" y2="${base + 3}" stroke="${starFill(run.top)}" stroke-width="3" stroke-linecap="round"/>`;
    hs.filter((h) => hourly || h % 3 === 2).forEach((h) => g += arrowG(spot, fromAt(d, h), X(h) + uw / 2, base + 13, 11));
    g += `<text x="${sx + sw / 2}" y="${H - 3}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono" fill="#2f6f9f">${wave(spot, d).m} m</text>`;
    if (d === 0 && from < NOW) g += `<rect x="${X(from)}" y="${top - 8}" width="${X(NOW) - X(from)}" height="${base - top + 8}" fill="#fffdf6" fill-opacity=".6"/>`;
    if (d === 0) g += `<line x1="${X(Math.max(from, NOW)) - .5}" x2="${X(Math.max(from, NOW)) - .5}" y1="${top - 6}" y2="${base}" stroke="#d43a2c" stroke-width="2"/>`;
    if (k < segs.length - 1) g += `<line x1="${sx + sw + gap / 2}" x2="${sx + sw + gap / 2}" y1="${top}" y2="${base}" stroke="#1a1d2122" stroke-dasharray="1 3"/>`;
    x += sw + gap;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${spot.name}: the wind and its gusts, and your stars, today and the next five days"><defs>${defs}</defs>${g}</svg></div>`;
}

/* ---- 7a–7c · today in more detail, over the next five days drawn as 6d ---- */
const LAST_LIGHT = "17:33";
// High and low water today, from the tide's curve.
function tideTurns(d) {
  const out = []; let prev = tideAt(d, 0), rising = tideAt(d, .02) > prev;
  for (let t = .02; t < 24; t += .02) { const v = tideAt(d, t), up = v > prev; if (up !== rising) out.push({ t: t - .02, high: rising }); rising = up; prev = v; }
  return out;
}
const clockOf = (t) => `${hh(Math.floor(t))}:${String(Math.round((t % 1) * 60) % 60).padStart(2, "0")}`;
const TIDE_UP = `<svg width="9" height="9" viewBox="0 0 9 9"><path d="M4.5 1v7M1.5 4l3-3 3 3" fill="none" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TIDE_DOWN = `<svg width="9" height="9" viewBox="0 0 9 9"><path d="M4.5 8V1M1.5 5l3 3 3-3" fill="none" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function todayHead(spot) {
  const w = wave(spot, 0), turns = tideTurns(0).filter((x) => x.t >= 6 && x.t <= 20);
  return `<div class="sec"><span style="color:var(--ink)">Today</span><span class="r">
    <span>${sky(skyAt(0, 14), 15)}${airAt(0, 14)}°</span><span>${WAVE}${w.m} m · ${w.s} s</span>
    ${turns.map((x) => `<span>${x.high ? TIDE_UP : TIDE_DOWN}${clockOf(x.t)}</span>`).join("")}
    <span>last light ${LAST_LIGHT}</span></span></div>`;
}
// 7a: today a chart of its own, the whole width: the hours, the sky, a star on each rated hour, the band, the knots and arrows.
function todayChart(spot) {
  const phone = S.device === "phone", W = phone ? 344 : 580, hs = hours(0), uw = W / hs.length, X = (h) => (h - LIGHT_FROM) * uw;
  const H = 156, top = 56, base = 112, y = (kn) => base - Math.min(kn, 45) / 45 * (base - top), every = phone ? 2 : 1;
  let g = "", defs = "";
  [10, 20, 30].forEach((k) => g += `<line x1="0" x2="${W}" y1="${y(k)}" y2="${y(k)}" stroke="#1a1d21" stroke-opacity=".08"/>`);
  hs.forEach((h, i) => { if (i % every === 0) g += `<text x="${X(h) + uw / 2}" y="9" text-anchor="middle" font-size="9" font-family="IBM Plex Mono" fill="#5b5c5b">${hh(h)}</text>`;
    if (i % (phone ? 2 : 1) === 0) g += skyG(skyAt(0, h), X(h) + uw / 2, 23, 15); });
  // a star over each rated hour, a dot where there is none
  hs.forEach((h) => { const r = rate(spot, 0, h); g += r.stars ? starAt(X(h) + uw / 2, 42, 11, starFill(r.stars)) : `<circle cx="${X(h) + uw / 2}" cy="42" r="1.4" fill="#1a1d21" fill-opacity=".25"/>`; });
  const stops = (f, o) => hs.map((h, i) => `<stop offset="${((i + .5) / hs.length).toFixed(3)}" stop-color="${windCss(f(h))}" stop-opacity="${o}"/>`).join("");
  defs += `<linearGradient id="td${spot.id}m" x2="${W}" gradientUnits="userSpaceOnUse">${stops((h) => rate(spot, 0, h).mean, 1)}</linearGradient><linearGradient id="td${spot.id}g" x2="${W}" gradientUnits="userSpaceOnUse">${stops((h) => rate(spot, 0, h).gust, .5)}</linearGradient>`;
  const pts = (f) => [[0, f(hs[0])], ...hs.map((h) => [X(h) + uw / 2, f(h)]), [W, f(hs[hs.length - 1])]], P = (a) => a.map(([u, v]) => `${u.toFixed(1)} ${v.toFixed(1)}`).join("L");
  const mean = (h) => y(rate(spot, 0, h).mean), gust = (h) => y(rate(spot, 0, h).gust);
  g += `<path d="M${P(pts(gust))}L${P(pts(mean).reverse())}Z" fill="url(#td${spot.id}g)"/><path d="M0 ${base}L${P(pts(mean))}L${W} ${base}Z" fill="url(#td${spot.id}m)"/>`;
  g += `<path d="M${P(pts(gust))}" fill="none" stroke="#1a1d21" stroke-opacity=".28" stroke-dasharray="2 2"/><path d="M${P(pts(mean))}" fill="none" stroke="#1a1d21" stroke-opacity=".75" stroke-width="1.2"/>`;
  // the tide over the day, a thin blue line low in the band
  const tide = []; for (let t = LIGHT_FROM; t <= LIGHT_TO; t += .25) tide.push([(t - LIGHT_FROM) * uw, base - 4 - (tideAt(0, t) - .4) / 4 * 26]);
  g += `<path d="M${P(tide)}" fill="none" stroke="#2f6f9f" stroke-opacity=".7" stroke-width="1.2" stroke-dasharray="4 2"/>`;
  hs.forEach((h) => { const r = rate(spot, 0, h), cx = X(h) + uw / 2;
    g += `<text x="${cx}" y="${base + 14}" text-anchor="middle" font-size="10" font-weight="600" font-family="IBM Plex Mono">${Math.round(r.mean)}</text>`;
    if (!phone) g += `<text x="${cx}" y="${base + 25}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono" fill="#5b5c5b">g${Math.round(r.gust)}</text>`;
    g += arrowG(spot, r.from, cx, base + (phone ? 26 : 37), 11); });
  g += `<rect x="0" y="0" width="${X(NOW)}" height="${H}" fill="#fffdf6" fill-opacity=".55"/><line x1="${X(NOW)}" x2="${X(NOW)}" y1="2" y2="${base}" stroke="#d43a2c" stroke-width="2"/>`;
  g += `<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}" stroke="#1a1d2166"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${phone ? H - 10 : H}">${`<defs>${defs}</defs>`}${g}</svg></div>`;
}
// 7c: today hour by hour, as the dock lists it: a column an hour.
function todayHours(spot) {
  return `<div class="hours">${hours(0).map((h) => { const r = rate(spot, 0, h);
    return `<div class="hr ${h < NOW ? "gone" : ""} ${h === NOW ? "now" : ""}"><small>${hh(h)}</small>${sky(skyAt(0, h), 16)}
      <span class="bar" style="background:${windCss(r.mean)}"></span><b>${Math.round(r.mean)}</b><small>g${Math.round(r.gust)}</small>${arrow(spot, r.from, 12)}
      <span class="st">${r.stars ? `<svg width="12" height="12" viewBox="0 0 10 10"><path d="${STAR_PATH}" fill="${starFill(r.stars)}" stroke="#1a1d21" stroke-opacity=".55" stroke-width=".9"/></svg>` : `<i></i>`}</span></div>`; }).join("")}</div>`;
}
const NEXT5 = (spot) => `<div class="sec mt"><span style="color:var(--ink)">Next 5 days</span></div>${windBand(spot, "day", { days: [1, 2, 3, 4, 5] })}`;
const design7a = (spot) => todayHead(spot) + todayChart(spot) + NEXT5(spot);
const design7b = (spot) => todayHead(spot) + windBand(spot, "day", { todayFrom: LIGHT_FROM, todayScale: 2.4, todayHourly: true });
const design7c = (spot) => todayHead(spot) + todayHours(spot) + NEXT5(spot);

/* ---- 4 · day tiles ---------------------------------------------------------------- */
function design4(spot) {
  return `<div class="tiles6">${[0, 1, 2, 3, 4, 5].map((d) => {
    const hs = hours(d).filter((h) => d || h >= NOW), ph = peakHour(spot, d), r = rate(spot, d, ph), wv = wave(spot, d);
    const lo = Math.round(Math.min(...hs.map((h) => rate(spot, d, h).mean))), hi = Math.round(Math.max(...hs.map((h) => rate(spot, d, h).mean)));
    const gmax = Math.round(Math.max(...hs.map((h) => rate(spot, d, h).gust)));
    return `<div class="tile ${d ? "" : "today"}"><div class="dh"><span>${d ? DAYS[d].short : "Today"}</span><small>${maxStar(dayMax(spot, d))}</small></div>
      <div class="sky">${sky(skyAt(d, d ? 13 : 14), 20)}<span>${airAt(d, 13)}°</span></div>
      <div class="kn">${arrow(spot, r.from, 13)}${lo === hi ? lo : `${lo}–${hi}`}<small>g${gmax}</small></div>
      <div class="wv">${WAVE}${wv.m} m · ${wv.s}s</div>${ribbon(spot, d)}</div>`;
  }).join("")}</div>`;
}

/* ---- the page ---------------------------------------------------------------------- */
const DESIGNS = { 1: design1, 2: design2, 3: design3, 4: design4, 5: design5, 6: design6,
  "7a": design7a, "7b": design7b, "7c": design7c,
  "6a": (s) => windBand(s, "top"), "6b": (s) => windBand(s, "window"), "6c": (s) => windBand(s, "row"), "6d": (s) => windBand(s, "day") };
function card(spot) {
  const w = S.device === "phone" ? 96 : 112, h = Math.round(w * 10 / 16);
  return `<div class="card" data-spot="${spot.id}" role="link" tabindex="0">
    <div class="head"><button class="sat" data-chart="${spot.id}" aria-label="${spot.name} on the chart">${satTiles(spot.lat, spot.lon, 14, w, h)}${rose(spot, fromAt(0, NOW), w, h)}<span class="go">Chart</span></button>
      <div class="nm"><b>${spot.name}</b><small>${spot.km} km · Co. ${spot.county}</small></div>
      <button class="fav" data-fav="${spot.id}" aria-label="Star ${spot.name}">${FAV(S.starred.has(spot.id))}</button></div>
    ${DESIGNS[S.design](spot)}</div>`;
}
function ranked() {
  const pool = S.scope === "yours" ? SPOTS.filter((s) => S.starred.has(s.id)) : SPOTS;
  const key = (s) => { const m = [0, 1, 2, 3, 4, 5].map((d) => dayMax(s, d)), top = Math.max(...m); return top * 10 - m.indexOf(top); };
  return pool.slice().sort((a, b) => key(b) - key(a) || a.km - b.km);
}
function legend() {
  const sw = [1, 2, 3, 4, 5].map((n) => `<i style="background:${starFill(n)}"></i>`).join("");
  const bars = S.design === "5" || S.design === "2";
  if (S.design.startsWith("6") && S.design.length === 2) {
    const wind = [8, 12, 16, 20, 25, 30, 35].map((k) => `<i style="width:12px;border-radius:0;background:${windCss(k)}"></i>`).join("");
    return `<span class="key"><b style="color:var(--ink)">Wind</b> ${wind} 35 kn · solid: wind · pale above it: gusts</span>
      <span class="key"><b style="color:var(--ink)">Your stars</b> ${[1, 2, 3, 4, 5].map((n) => `<svg width="11" height="11" viewBox="0 0 10 10"><path d="${STAR_PATH}" fill="${starFill(n)}" stroke="#1a1d21" stroke-opacity=".55" stroke-width=".9"/></svg>`).join("")} 1 to 5 · no star: not rideable for you</span>
      <span class="key">${arrow({ facing: 90 }, 270, 12)} the wind's way · <span style="color:var(--pen-ink)">red</span>: offshore</span>`;
  }
  return `<span class="key"><b style="color:var(--ink)">Your stars</b> 1 ${sw} 5 <i style="background:${NONE}"></i> none</span>
    ${bars ? `<span class="key">bar height: wind · pale tip: gusts</span>` : S.design === "6" || S.design === "3" ? `<span class="key">height: wind · faint line: gusts</span>` : ""}
    <span class="key">${arrow({ facing: 90 }, 270, 12)} the wind's way · <span style="color:var(--pen-ink)">red</span>: offshore</span>`;
}
function render() {
  const phone = S.device === "phone", el = document.getElementById("frame");
  el.className = `frame ${phone ? "phone" : "desk"}`;
  el.innerHTML = `<div class="app"><header class="top"><button class="burger" aria-label="Menu"><svg width="16" height="12"><path d="M0 1h16M0 6h16M0 11h16" stroke="#1a1d21" stroke-width="1.6"/></svg></button>
      ${phone ? "" : `<span class="word">wingfoil<i>.ie</i></span>`}<span class="sp"></span>
      <div class="seg">${[["yours", "Favourites"], ["near", "Near you"]].map(([k, n]) => `<button data-scope="${k}" aria-pressed="${S.scope === k}">${n}</button>`).join("")}</div></header>
    <div class="list">
      <div class="grid">${ranked().map(card).join("")}</div></div>
    ${S.toast ? `<div class="toast">${S.toast}</div>` : ""}</div>`;
  bind(el);
  // today's row of hours opens at now, one hour gone still in view
  el.querySelectorAll(".hours").forEach((r) => { const n = r.querySelector(".now"); if (n && r.scrollWidth > r.clientWidth) r.scrollLeft = n.offsetLeft - r.offsetLeft - n.offsetWidth - 6; });
  for (const [k, v] of [["design", S.design], ["device", S.device], ["colour", S.colour]])
    document.querySelectorAll(`.mockbar [data-${k}]`).forEach((b) => b.setAttribute("aria-pressed", b.dataset[k] === v));
  document.getElementById("why").innerHTML = WHY[S.design] + COMMON;
}
function bind(el) {
  const say = (t) => { S.toast = t; render(); clearTimeout(say.t); say.t = setTimeout(() => { S.toast = null; render(); }, 2200); };
  el.querySelectorAll("[data-scope]").forEach((b) => b.onclick = () => { S.scope = b.dataset.scope; render(); });
  el.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { S.sort = b.dataset.sort; render(); });
  el.querySelectorAll("[data-fav]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const id = b.dataset.fav; S.starred.has(id) ? S.starred.delete(id) : S.starred.add(id); render(); });
  el.querySelectorAll("[data-chart]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); say(`Opens ${SPOTS.find((s) => s.id === b.dataset.chart).name} on the chart`); });
  el.querySelectorAll("[data-spot]").forEach((c) => c.onclick = () => say(`Opens the ${SPOTS.find((s) => s.id === c.dataset.spot).name} spot page`));
}
for (const k of ["design", "device", "colour"]) document.querySelectorAll(`.mockbar [data-${k}]`).forEach((b) => b.onclick = () => { S[k] = b.dataset[k]; render(); });
