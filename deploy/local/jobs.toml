# Force5 local ingest schedule. Edit, then `npm run deploy:up` (or
# `docker compose -f deploy/local/docker-compose.yml restart scheduler`).
#
# All times are UTC, because model cycles are published in UTC. `hours` defaults
# to every hour and `minutes` defaults to [0]. Jobs run one at a time in the order
# written here, so two slots in the same minute never fight over the worker lock.
# Check a change before restarting:
#   docker compose -f deploy/local/docker-compose.yml run --rm scheduler --list
#
# command = "worker" (default) runs force5/ingest/worker.py --models <models> <args>.
# command = "prune" runs the retention script instead. Freshness is not scheduled:
# `npm run deploy:status` prints it on demand, and the hosted control plane alerts on it.
# `memory = "3Gb"` overrides a job's container ceiling for Home Compute, on the Mac mini
# and on Cloudflare (deploy/schedules.py, which also checks every minute is a multiple of 5); this
# scheduler ignores it. Model ids are the ones in force5/ingest/registry.py. An id with no registry entry
# disables only its own job; the rest keep running, so you can write entries for
# harmonie-eps, gfs-wave or mi-swan now and enable them by adding the adapter.

[[jobs]]
id = "harmonie"
models = ["harmonie"]
args = ["--step", "1"]
hours = [5, 8, 11, 16, 19, 23]  # Six a day, each fresh just before riders look (Irish
minutes = [35]              # winter time; an hour later by the clock in summer): the
timeout_seconds = 3300      # commute in, the desk, lunch, the commute home, the evening's
                            # planning, and last thing. Met Éireann starts a run every
                            # hour and lists it complete (+000 to +060, ~826 MB) about
                            # 2 h 25 m later, so :35 takes the run from 2 h 35 m before;
                            # on the hour it took the one from three hours before.

[[jobs]]
id = "icon-eu"
models = ["icon-eu"]
args = ["--step", "1"]
hours = [3]                 # Once a day: the 00 UTC cycle plus ~3.5 h publication lag.
minutes = [30]
timeout_seconds = 3300

[[jobs]]
id = "icon-eu-weather"
models = ["icon-eu-weather"]
hours = [3]                 # Once a day: the 00 UTC cycle, ready before the morning.
minutes = [40]
timeout_seconds = 3300

[[jobs]]
id = "ecmwf"
models = ["ecmwf"]
hours = [8, 10, 20, 22]     # Twice a day: the 00 and 12 UTC runs, the two that reach 15
minutes = [20]              # days, complete on open data at ~07:35 and ~19:35 UTC. 10:20
timeout_seconds = 3300      # and 22:20 are retries that download nothing once the slot
                            # before has published. ~250 MB a run; 40 h age limit. The
                            # 06/18 UTC runs reach only +90 h, inside HARMONIE's reach.

[[jobs]]
id = "harmonie-eps"
models = ["harmonie-eps"]
enabled = false             # Lagged controls only (13 MB per member-step); enable knowingly.
minutes = [50]
timeout_seconds = 3300

[[jobs]]
id = "ecmwf-ens"
models = ["ecmwf-ens"]
hours = [8, 10]             # The 00 UTC run only (~7-9 h late); 10:35 is a retry that
                            # skips the download once 08:35 has published. ~0.49 GB a day.
minutes = [35]
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "aifs"
models = ["aifs"]
args = ["--ecmwf-source", "ecmwf"]
hours = [0, 6, 12, 18]      # All four AIFS cycles, each published ~6 h after its
minutes = [25]              # run time. ~92 MB, 61 frames, no gust field.
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "gfs"
models = ["gfs"]
args = ["--step", "3"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~4 h publication lag. :45 is a
minutes = [0, 45]           # retry for a cycle not yet complete at :00 (the 06Z on 18
timeout_seconds = 2400      # October); it reads the bucket and stops once :00 has published.

[[jobs]]
id = "gefs"
models = ["gefs"]
hours = [5, 11, 17, 23]     # 00/06/12/18 UTC cycles plus ~5 h: the 0.25° members
minutes = [10]              # finish 4.5-6 h after run time. ~19 MB, 23-33 min from NOMADS;
                            # args = ["--noaa-source", "s3"] takes ~2.5 min for ~2.8 GB.
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "arpege"
models = ["arpege"]
args = ["--step", "3"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~4 h 50 m: the 0.1° surface
minutes = [50]              # package completes 3–4.5 h after run time. ~35 MB per run.
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "arome"
models = ["arome"]
args = ["--step", "3"]
hours = [1, 4, 7, 10, 13, 16, 19, 22]   # Eight cycles a day, three-hourly, plus
minutes = [55]                          # ~4 h 55 m. ~37 MB per run.
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "gfs-wave"
models = ["gfs-wave"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~3 h 50 m publication lag. :55
minutes = [30, 55]          # is a retry for a cycle not out at :30, as GFS's :45.
timeout_seconds = 2400

[[jobs]]
id = "gfs-weather"
models = ["gfs-weather"]
hours = [5, 11, 17, 23]     # 00/06/12/18 UTC cycles plus ~5 h: the whole 384 h run is
minutes = [5, 35]           # listed later than the wind's 240 h. :35 is a retry that stops
timeout_seconds = 2400      # at once when :05 has published. ~13 MB a run from NOMADS.

[[jobs]]
id = "mi-swan"
models = ["mi-swan"]
hours = [10, 14, 18]        # One SWAN run a day, published around 09 UTC, sometimes late.
minutes = [15]
timeout_seconds = 1800

[[jobs]]
id = "ecmwf-wave"
models = ["ecmwf-wave"]
args = ["--ecmwf-source", "ecmwf"]
hours = [8, 20]             # The 00/12 UTC wave stream, published ~8 h after the run.
minutes = [45]              # ~715 MB with the period bands; the AWS mirror throttles.
timeout_seconds = 3300
enabled = false             # Retired to keep downloads near 80 GB a month.

[[jobs]]
id = "tides"
models = ["tides"]
hours = [1]                 # Daily: predictions, not a forecast cycle. 30 h limit.
minutes = [5]
timeout_seconds = 1800

[[jobs]]
id = "sea-temperature"
models = ["sea-temperature"]
hours = [0, 3, 6, 9, 12, 15, 18, 21]   # Observations, not a cycle: every 3 h is
minutes = [15]              # plenty for hourly buoys. Shares :15 with mi-swan,
timeout_seconds = 900       # which the one-job-at-a-time loop serialises.

[[jobs]]
id = "blend"
models = ["blend"]
minutes = [5]               # Hourly, from whatever the wind jobs have published by
timeout_seconds = 600       # then.

[[jobs]]
id = "blend-after-harmonie"
models = ["blend"]
hours = [5, 8, 11, 16, 19, 23]  # Ten minutes after each HARMONIE slot, so the map's stars
minutes = [45]              # take the new run now rather than at the next :05.
timeout_seconds = 600

[[jobs]]
id = "wind-obs"
models = ["wind-obs"]
minutes = [50]              # Hourly: Met Éireann's readings land 30-45 minutes after the
timeout_seconds = 600       # hour. Each run re-reads 72 h, so a missed hour loses nothing.

[[jobs]]
id = "forecast-archive"
models = ["forecast-archive"]
minutes = [15]              # Hourly, after the blend: copies every run being served into
timeout_seconds = 1800      # archive/ before its successor deletes it. Shares :15 with
                            # sea-temperature and mi-swan, which the loop serialises.

[[jobs]]
id = "verify"
models = ["verify"]
hours = [7]                 # Daily, after the 07:15 archive: scores every model and the
minutes = [25]              # blend against the archived observations (docs/VERIFICATION.md).
timeout_seconds = 1800

[[jobs]]
id = "prune"
command = "prune"
minutes = [10]              # Deletes a superseded run an hour after the new one lands
                            # (the worker keeps it that long for readers still holding
                            # the old pointer), and ages the raw cache.
timeout_seconds = 900

