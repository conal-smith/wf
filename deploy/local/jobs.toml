# Force5 local ingest schedule. Edit, then `npm run deploy:up` (or
# `docker compose -f deploy/local/docker-compose.yml restart scheduler`).
#
# All times are UTC, because model cycles are published in UTC. `hours` defaults
# to every hour and `minutes` defaults to [0]. Jobs run one at a time in the order
# written here, so two slots in the same minute never fight over the worker lock.
# Check a change before restarting:
#   docker compose -f deploy/local/docker-compose.yml run --rm scheduler --list
#
# command = "worker" (default) runs force5/ingest/worker.py --models <models> <args>.
# command = "prune" or "status" runs the retention and freshness scripts instead.
# `memory = "3Gb"` overrides a job's container ceiling for Home Compute and Cloudflare
# (deploy/schedules.py, which also checks every minute is a multiple of 5); this
# scheduler ignores it. Model ids are the ones in force5/ingest/registry.py. An id with no registry entry
# disables only its own job; the rest keep running, so you can write entries for
# harmonie-eps, gfs-wave or mi-swan now and enable them by adding the adapter.

[[jobs]]
id = "harmonie"
models = ["harmonie"]
args = ["--step", "1"]
hours = [6, 12]             # Twice a day: 7 am and 1 pm Irish summer time, 6 am and
minutes = [0]               # noon in winter. Each run is ~810 MB of whole files, so
timeout_seconds = 3300      # only when riders are planning a session.

[[jobs]]
id = "icon-eu"
models = ["icon-eu"]
args = ["--step", "1"]
hours = [3, 9, 15, 21]      # 00/06/12/18 UTC cycles plus ~3.5 h publication lag.
minutes = [30]
timeout_seconds = 3300

[[jobs]]
id = "icon-eu-weather"
models = ["icon-eu-weather"]
hours = [3]                 # Once a day: the 00 UTC cycle, ready before the morning.
minutes = [40]
timeout_seconds = 3300

[[jobs]]
id = "ecmwf"
models = ["ecmwf"]
minutes = [20]              # Hourly check; the importer picks the newest full run.
timeout_seconds = 3300

[[jobs]]
id = "harmonie-eps"
models = ["harmonie-eps"]
enabled = false             # Lagged controls only (13 MB per member-step); enable knowingly.
minutes = [50]
timeout_seconds = 3300

[[jobs]]
id = "ecmwf-ens"
models = ["ecmwf-ens"]
hours = [8, 10]             # The 00 UTC run only (~7-9 h late); 10:35 is a retry that
                            # skips the download once 08:35 has published. ~0.49 GB a day.
minutes = [35]
timeout_seconds = 3300

[[jobs]]
id = "aifs"
models = ["aifs"]
args = ["--ecmwf-source", "ecmwf"]
hours = [0, 6, 12, 18]      # All four AIFS cycles, each published ~6 h after its
minutes = [25]              # run time. ~92 MB, 61 frames, no gust field.
timeout_seconds = 3300

[[jobs]]
id = "gfs"
models = ["gfs"]
args = ["--step", "3"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~4 h publication lag.
minutes = [0]
timeout_seconds = 2400

[[jobs]]
id = "gefs"
models = ["gefs"]
hours = [5, 11, 17, 23]     # 00/06/12/18 UTC cycles plus ~5 h: the 0.25° members
minutes = [10]              # finish 4.5-6 h after run time. ~19 MB, 23-33 min from NOMADS;
                            # args = ["--noaa-source", "s3"] takes ~2.5 min for ~2.8 GB.
timeout_seconds = 3300

[[jobs]]
id = "arpege"
models = ["arpege"]
args = ["--step", "3"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~4 h 50 m: the 0.1° surface
minutes = [50]              # package completes 3–4.5 h after run time. ~35 MB per run.
timeout_seconds = 3300

[[jobs]]
id = "arome"
models = ["arome"]
args = ["--step", "3"]
hours = [1, 4, 7, 10, 13, 16, 19, 22]   # Eight cycles a day, three-hourly, plus
minutes = [55]                          # ~4 h 55 m. ~37 MB per run.
timeout_seconds = 3300

[[jobs]]
id = "gfs-wave"
models = ["gfs-wave"]
hours = [4, 10, 16, 22]     # 00/06/12/18 UTC cycles plus ~3 h 50 m publication lag.
minutes = [30]
timeout_seconds = 2400

[[jobs]]
id = "mi-swan"
models = ["mi-swan"]
hours = [10, 14, 18]        # One SWAN run a day, published around 09 UTC, sometimes late.
minutes = [15]
timeout_seconds = 1800

[[jobs]]
id = "ecmwf-wave"
models = ["ecmwf-wave"]
args = ["--ecmwf-source", "ecmwf"]
hours = [8, 20]             # The 00/12 UTC wave stream, published ~8 h after the run.
minutes = [45]              # ~715 MB with the period bands; the AWS mirror throttles.
timeout_seconds = 3300

[[jobs]]
id = "tides"
models = ["tides"]
hours = [1]                 # Daily: predictions, not a forecast cycle. 30 h limit.
minutes = [5]
timeout_seconds = 1800

[[jobs]]
id = "sea-temperature"
models = ["sea-temperature"]
hours = [0, 3, 6, 9, 12, 15, 18, 21]   # Observations, not a cycle: every 3 h is
minutes = [15]              # plenty for hourly buoys. Shares :15 with mi-swan,
timeout_seconds = 900       # which the one-job-at-a-time loop serialises.

[[jobs]]
id = "blend"
models = ["blend"]
minutes = [5]               # Hourly, from whatever the wind jobs have published by
timeout_seconds = 600       # then: HARMONIE's :45 run is in 20 minutes later.

[[jobs]]
id = "wind-obs"
models = ["wind-obs"]
minutes = [50]              # Hourly: Met Éireann's readings land 30-45 minutes after the
timeout_seconds = 600       # hour. Each run re-reads 72 h, so a missed hour loses nothing.

[[jobs]]
id = "forecast-archive"
models = ["forecast-archive"]
minutes = [15]              # Hourly, after the blend: copies every run being served into
timeout_seconds = 1800      # archive/ before its successor deletes it. Shares :15 with
                            # sea-temperature and mi-swan, which the loop serialises.

[[jobs]]
id = "verify"
models = ["verify"]
hours = [7]                 # Daily, after the 07:15 archive: scores every model and the
minutes = [25]              # blend against the archived observations (docs/VERIFICATION.md).
timeout_seconds = 1800

[[jobs]]
id = "prune"
command = "prune"
minutes = [10]              # Backstop only: the worker already deletes a superseded
                            # run when the new one lands. This also ages the raw cache.
timeout_seconds = 900

[[jobs]]
id = "status"
command = "status"
minutes = [55]              # Hourly freshness line in the scheduler log.
timeout_seconds = 120

