<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__sky {
        fill: var(--sem-color-sea-4);
      }
      .demo__sea {
        fill: var(--sem-color-sea-1);
      }
      .demo__wing {
        fill: var(--sem-color-chart-magenta);
      }
      .demo__who {
        display: flex;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__name {
        display: block;
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__detail {
        display: block;
        color: var(--sem-color-ink-2);
        font-size: var(--sem-font-size-body);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Avatar in dark</h2>
      <p class="demo__label">Monogram: sm, md, lg</p>
      <div class="demo__row">
        <span class="wf-avatar wf-avatar--sm" aria-hidden="true">AN</span>
        <span class="wf-avatar" aria-hidden="true">AN</span>
        <span class="wf-avatar wf-avatar--lg" aria-hidden="true">AN</span>
        <span class="wf-avatar" aria-hidden="true">SÓ</span>
      </div>
      <p class="demo__label">Photo: sm, md, lg</p>
      <div class="demo__row">
        <span class="wf-avatar wf-avatar--sm" aria-hidden="true"><svg class="wf-avatar__image" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid slice"><rect class="demo__sky" width="40" height="40" /><rect class="demo__sea" y="22" width="40" height="18" /><path class="demo__wing" d="M12 12 Q22 5 30 14 Q21 11 16 17Z" /></svg></span>
        <span class="wf-avatar" aria-hidden="true"><svg class="wf-avatar__image" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid slice"><rect class="demo__sky" width="40" height="40" /><rect class="demo__sea" y="22" width="40" height="18" /><path class="demo__wing" d="M12 12 Q22 5 30 14 Q21 11 16 17Z" /></svg></span>
        <span class="wf-avatar wf-avatar--lg" aria-hidden="true"><svg class="wf-avatar__image" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid slice"><rect class="demo__sky" width="40" height="40" /><rect class="demo__sea" y="22" width="40" height="18" /><path class="demo__wing" d="M12 12 Q22 5 30 14 Q21 11 16 17Z" /></svg></span>
      </div>
      <p class="demo__label">Beside the name, always</p>
      <div class="demo__who">
        <span class="wf-avatar" aria-hidden="true">AN</span>
        <span><span class="demo__name">Aoife Ní Bhriain</span><span class="demo__detail">Dollymount, 3 listings</span></span>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Avatar in light</h2>
      <div class="demo__row">
        <span class="wf-avatar wf-avatar--sm" aria-hidden="true">SÓ</span>
        <span class="wf-avatar" aria-hidden="true">AN</span>
        <span class="wf-avatar" aria-hidden="true"><svg class="wf-avatar__image" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid slice"><rect class="demo__sky" width="40" height="40" /><rect class="demo__sea" y="22" width="40" height="18" /><path class="demo__wing" d="M12 12 Q22 5 30 14 Q21 11 16 17Z" /></svg></span>
        <span class="wf-avatar wf-avatar--lg" aria-hidden="true">AN</span>
      </div>
      <p class="demo__label">Beside the name</p>
      <div class="demo__who">
        <span class="wf-avatar" aria-hidden="true">AN</span>
        <span><span class="demo__name">Aoife Ní Bhriain</span><span class="demo__detail">Dollymount, 3 listings</span></span>
      </div>
    </section>
  </body>
</html>
