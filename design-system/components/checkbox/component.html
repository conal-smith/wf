<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkbox — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Checkbox in dark</h2>

      <p class="demo__label">Checked and unchecked, in a soft card</p>
      <div class="demo__card">
        <div><label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" checked /><span class="wf-checkbox__label">Depth tints</span></label></div>
        <div><label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" checked /><span class="wf-checkbox__label">Contours and soundings</span></label></div>
        <div><label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" /><span class="wf-checkbox__label">Land relief</span></label></div>
      </div>

      <p class="demo__label">Focus-visible (held)</p>
      <div class="demo__row">
        <label class="wf-checkbox"><input class="wf-checkbox__input is-focus" type="checkbox" /><span class="wf-checkbox__label">Land relief</span></label>
        <label class="wf-checkbox"><input class="wf-checkbox__input is-focus" type="checkbox" checked /><span class="wf-checkbox__label">Spot names</span></label>
      </div>

      <p class="demo__label">Disabled</p>
      <div class="demo__row">
        <label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" disabled /><span class="wf-checkbox__label">Sold</span></label>
        <label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" checked disabled /><span class="wf-checkbox__label">Starred</span></label>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Checkbox in light</h2>
      <div><label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" checked /><span class="wf-checkbox__label">Depth tints</span></label></div>
      <div><label class="wf-checkbox"><input class="wf-checkbox__input is-focus" type="checkbox" /><span class="wf-checkbox__label">Land relief</span></label></div>
      <div><label class="wf-checkbox"><input class="wf-checkbox__input" type="checkbox" checked disabled /><span class="wf-checkbox__label">Spot names</span></label></div>
    </section>
  </body>
</html>
