<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chip — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Chip in dark</h2>

      <p class="demo__label">Choices: one on</p>
      <div class="wf-chip-row" role="group" aria-label="Stars">
        <button class="wf-chip" type="button" aria-pressed="false">Any stars</button>
        <button class="wf-chip" type="button" aria-pressed="false">3+ stars</button>
        <button class="wf-chip" type="button" aria-pressed="true">4+ stars</button>
        <button class="wf-chip" type="button" aria-pressed="false">5 stars</button>
      </div>

      <p class="demo__label">A filter in use, removable, with a quiet Clear</p>
      <div class="demo__row">
        <button class="wf-chip" type="button" aria-label="Remove: spots named Bally">
          Spots named “Bally”
          <svg class="wf-chip__remove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
        <button class="wf-chip" type="button" aria-label="Remove: 4+ stars">
          4+ stars
          <svg class="wf-chip__remove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <p class="demo__label">On a soft card: the chips take the card's second grey</p>
      <div class="demo__card wf-chip-row">
        <button class="wf-chip" type="button" aria-pressed="false">Today</button>
        <button class="wf-chip" type="button" aria-pressed="true">Tomorrow</button>
        <button class="wf-chip" type="button" aria-pressed="false">Weekend</button>
      </div>

      <p class="demo__label">Hover, focus, disabled (held)</p>
      <div class="wf-chip-row">
        <button class="wf-chip is-hover" type="button" aria-pressed="false">Today</button>
        <button class="wf-chip is-focus" type="button" aria-pressed="false">Tomorrow</button>
        <button class="wf-chip" type="button" aria-pressed="false" disabled>Weekend</button>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Chip in light</h2>
      <div class="wf-chip-row" role="group" aria-label="Stars">
        <button class="wf-chip" type="button" aria-pressed="false">Any stars</button>
        <button class="wf-chip" type="button" aria-pressed="true">3+ stars</button>
        <button class="wf-chip" type="button" aria-pressed="false">4+ stars</button>
        <button class="wf-chip is-hover" type="button" aria-pressed="false">5 stars</button>
        <button class="wf-chip" type="button" aria-label="Remove: spots named Bally">
          Spots named “Bally”
          <svg class="wf-chip__remove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
    </section>
  </body>
</html>
