<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../text-input/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Field in dark</h2>
      <div class="demo__stack">
        <div class="wf-field-grid">
          <div class="wf-field">
            <label class="wf-field__label" for="fd-d-name">Your name</label>
            <div class="wf-text-input"><input class="wf-text-input__input" id="fd-d-name" value="Aoife" /></div>
          </div>
          <div class="wf-field">
            <label class="wf-field__label" for="fd-d-home">Your home spot</label>
            <div class="wf-text-input"><input class="wf-text-input__input" id="fd-d-home" placeholder="e.g. Dollymount" aria-describedby="fd-d-home-hint" /></div>
            <small class="wf-field__hint" id="fd-d-home-hint">It comes first in the finder.</small>
          </div>
        </div>
        <div class="wf-field wf-field--invalid">
          <label class="wf-field__label" for="fd-d-price">Asking price</label>
          <div class="wf-text-input"><span class="wf-text-input__adornment">€</span><input class="wf-text-input__input" id="fd-d-price" value="" aria-invalid="true" aria-describedby="fd-d-price-error" /></div>
          <span class="wf-field__error" id="fd-d-price-error" role="alert">Give a price in euro.</span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Field in light</h2>
      <div class="demo__stack">
        <div class="wf-field">
          <label class="wf-field__label" for="fd-l-home">Your home spot</label>
          <div class="wf-text-input"><input class="wf-text-input__input" id="fd-l-home" placeholder="e.g. Dollymount" aria-describedby="fd-l-home-hint" /></div>
          <small class="wf-field__hint" id="fd-l-home-hint">It comes first in the finder.</small>
        </div>
        <div class="wf-field wf-field--invalid">
          <label class="wf-field__label" for="fd-l-price">Asking price</label>
          <div class="wf-text-input"><span class="wf-text-input__adornment">€</span><input class="wf-text-input__input" id="fd-l-price" value="" aria-invalid="true" aria-describedby="fd-l-price-error" /></div>
          <span class="wf-field__error" id="fd-l-price-error" role="alert">Give a price in euro.</span>
        </div>
      </div>
    </section>
  </body>
</html>
