<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figure — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__map {
        padding: var(--sem-space-x3);
        background: var(--sem-color-sea-3);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Figure in dark</h2>
      <div class="demo__row">
        <span class="wf-figure wf-figure--sm" role="img" aria-label="12 knots"><span class="wf-figure__value">12</span><span class="wf-figure__unit">kn</span></span>
        <span class="wf-figure" role="img" aria-label="14 knots gusting 22"><span class="wf-figure__value">14</span><span class="wf-figure__sup">22</span><span class="wf-figure__unit">kn</span></span>
        <span class="wf-figure wf-figure--alarm" role="img" aria-label="13 knots gusting 26"><span class="wf-figure__value">13</span><span class="wf-figure__sup">26</span></span>
        <span class="wf-figure wf-figure--lg" role="img" aria-label="18 knots"><span class="wf-figure__value">18</span><span class="wf-figure__unit">kn</span></span>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Figure in light</h2>

      <p class="demo__label">Sizes: sm 13, md 19 (the default), lg 48, the reading</p>
      <div class="demo__row">
        <span class="wf-figure wf-figure--sm" role="img" aria-label="12 knots"><span class="wf-figure__value">12</span><span class="wf-figure__unit">kn</span></span>
        <span class="wf-figure" role="img" aria-label="14 knots"><span class="wf-figure__value">14</span><span class="wf-figure__unit">kn</span></span>
        <span class="wf-figure wf-figure--lg" role="img" aria-label="18 knots"><span class="wf-figure__value">18</span><span class="wf-figure__unit">kn</span></span>
      </div>

      <p class="demo__label">The gust raised over the mean</p>
      <div class="demo__row">
        <span class="wf-figure wf-figure--sm" role="img" aria-label="11 knots gusting 20"><span class="wf-figure__value">11</span><span class="wf-figure__sup">20</span></span>
        <span class="wf-figure" role="img" aria-label="14 knots gusting 22"><span class="wf-figure__value">14</span><span class="wf-figure__sup">22</span><span class="wf-figure__unit">kn</span></span>
        <span class="wf-figure wf-figure--lg" role="img" aria-label="14 knots gusting 22"><span class="wf-figure__value">14</span><span class="wf-figure__sup">22</span><span class="wf-figure__unit">kn</span></span>
      </div>

      <p class="demo__label">Alarm: a gust well over the mean, in the warm red</p>
      <div class="demo__row">
        <span class="wf-figure wf-figure--alarm" role="img" aria-label="12 knots gusting 21"><span class="wf-figure__value">12</span><span class="wf-figure__sup">21</span></span>
        <span class="wf-figure wf-figure--alarm" role="img" aria-label="13 knots gusting 26"><span class="wf-figure__value">13</span><span class="wf-figure__sup">26</span><span class="wf-figure__unit">kn</span></span>
      </div>

      <p class="demo__label">Other units: m, €, %</p>
      <div class="demo__row">
        <span class="wf-figure" role="img" aria-label="a 6.5 metre wing"><span class="wf-figure__value">6.5</span><span class="wf-figure__unit">m</span></span>
        <span class="wf-figure" role="img" aria-label="low tide 1.7 metres"><span class="wf-figure__value">1.7</span><span class="wf-figure__unit">m</span></span>
        <span class="wf-figure"><span class="wf-figure__value">€450</span></span>
        <span class="wf-figure wf-figure--sm" role="img" aria-label="rides 88 per cent"><span class="wf-figure__value">88</span><span class="wf-figure__unit">%</span></span>
      </div>
    </section>
  </body>
</html>
