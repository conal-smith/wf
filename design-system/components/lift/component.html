<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lift — wingfoil-chart</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../figure/component.css" />
    <link rel="stylesheet" href="../pen-note/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the paper, a mono label per row, and rows. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x5);
        background-color: var(--sem-color-ground);
        background-image: var(--sem-texture-grain);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo + .demo {
        border-top: var(--sem-rule-double) double var(--sem-color-ink);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x3);
        padding-bottom: var(--sem-space-x1);
        border-bottom: var(--sem-rule-heavy) solid var(--sem-color-ink);
        font-family: var(--sem-font-family-display);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-lead);
      }
      .demo__label {
        margin: var(--sem-space-x4) 0 var(--sem-space-x2);
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-eyebrow);
        line-height: var(--sem-font-line-eyebrow);
        font-weight: var(--sem-font-weight-eyebrow);
        letter-spacing: var(--sem-font-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__map {
        padding: var(--sem-space-x3);
        background: var(--sem-color-sea-3);
      }
    </style>
    <style>
      /* Demo only: the words the marks and labels sit in. */
      .demo__caption {
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-caption);
        line-height: var(--sem-font-line-caption);
        font-variant-numeric: tabular-nums;
        color: var(--sem-color-ink-muted);
      }
      .demo__row--marked {
        padding: var(--sem-space-x3);
      }
      /* Demo only: a run of hours, the chosen one lifted on its card. */
      .demo__hours {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: repeat(5, calc(var(--sem-space-step) * 12));
        font-family: var(--sem-font-family-mono);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      .demo__hours span {
        display: grid;
        gap: var(--sem-space-x1);
        padding: var(--sem-space-x2) 0 var(--sem-space-x4);
      }
      .demo__hours .wf-lift-card {
        top: 0;
        bottom: 0;
        left: calc(var(--sem-space-step) * 24);
        width: calc(var(--sem-space-step) * 12);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="light">
      <h2 class="demo__head">Lift</h2>

      <p class="demo__label">Round a few words</p>
      <div class="demo__row demo__row--marked">
        <span class="wf-figure"><span class="wf-figure__value">€140</span></span>
        <span class="wf-lift"><span class="wf-pen-note wf-pen-note--sm">new</span></span>
        <span class="demo__caption">Replying to</span>
        <span class="wf-lift">Aoife</span>
      </div>

      <p class="demo__label">Under the chosen hour</p>
      <div class="demo__row demo__row--marked">
        <div class="demo__hours">
          <span class="wf-lift-card" aria-hidden="true"></span>
          <span>12:00<b>15</b></span>
          <span>13:00<b>17</b></span>
          <span>14:00<b>18</b></span>
          <span>15:00<b>16</b></span>
          <span>16:00<b>13</b></span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Lift · night chart (proposed)</h2>
      <div class="demo__row demo__row--marked">
        <span class="wf-lift"><span class="wf-pen-note wf-pen-note--sm">new</span></span>
      </div>
    </section>
  </body>
</html>
