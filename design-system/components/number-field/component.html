<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Number field — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../field/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Number field in dark</h2>
      <div class="demo__stack">
        <div class="wf-field">
          <span class="wf-field__label" id="nf-d-weight">Weight</span>
          <span class="wf-number-field">
            <button class="wf-number-field__step" type="button" aria-label="Lighter"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <span class="wf-number-field__value" role="spinbutton" tabindex="0" aria-labelledby="nf-d-weight" aria-valuenow="80" aria-valuemin="40" aria-valuemax="140" aria-valuetext="80 kilograms">80<small class="wf-number-field__unit">kg</small></span>
            <button class="wf-number-field__step" type="button" aria-label="Heavier"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
          </span>
          <small class="wf-field__hint">Your weight helps us suggest the right wing size.</small>
        </div>
        <p class="demo__label">Hover on a step, focus on the value (held); at the bottom of the range</p>
        <div class="demo__row">
          <span class="wf-number-field">
            <button class="wf-number-field__step is-hover" type="button" aria-label="Smaller"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <span class="wf-number-field__value is-focus" role="spinbutton" tabindex="0" aria-label="Wing size" aria-valuenow="5" aria-valuemin="2" aria-valuemax="9">5<small class="wf-number-field__unit">m²</small></span>
            <button class="wf-number-field__step" type="button" aria-label="Larger"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
          </span>
          <span class="wf-number-field">
            <button class="wf-number-field__step" type="button" aria-label="Smaller" disabled><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <span class="wf-number-field__value" role="spinbutton" tabindex="0" aria-label="Wing size" aria-valuenow="2" aria-valuemin="2" aria-valuemax="9">2<small class="wf-number-field__unit">m²</small></span>
            <button class="wf-number-field__step" type="button" aria-label="Larger"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
          </span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Number field in light</h2>
      <div class="wf-field">
        <span class="wf-field__label" id="nf-l-weight">Weight</span>
        <span class="wf-number-field">
          <button class="wf-number-field__step" type="button" aria-label="Lighter"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
          <span class="wf-number-field__value" role="spinbutton" tabindex="0" aria-labelledby="nf-l-weight" aria-valuenow="80" aria-valuemin="40" aria-valuemax="140" aria-valuetext="80 kilograms">80<small class="wf-number-field__unit">kg</small></span>
          <button class="wf-number-field__step" type="button" aria-label="Heavier"><svg class="wf-number-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
        </span>
      </div>
    </section>
  </body>
</html>
