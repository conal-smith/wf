<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select — wingfoil-chart</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../text-input/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the paper, a mono label per row, and rows. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x5);
        background-color: var(--sem-color-ground);
        background-image: var(--sem-texture-grain);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo + .demo {
        border-top: var(--sem-rule-double) double var(--sem-color-ink);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x3);
        padding-bottom: var(--sem-space-x1);
        border-bottom: var(--sem-rule-heavy) solid var(--sem-color-ink);
        font-family: var(--sem-font-family-display);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-lead);
      }
      .demo__label {
        margin: var(--sem-space-x4) 0 var(--sem-space-x2);
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-eyebrow);
        line-height: var(--sem-font-line-eyebrow);
        font-weight: var(--sem-font-weight-eyebrow);
        letter-spacing: var(--sem-font-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__map {
        padding: var(--sem-space-x3);
        background: var(--sem-color-sea-3);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="light">
      <h2 class="demo__head">Select</h2>

      <p class="demo__label">At "any"</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Wing size"><option selected>Any size</option><option>4 m</option><option>5 m</option><option>6 m</option><option>7 m</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Chosen</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Spot"><option>Rusheen Bay</option><option>Dollymount</option><option selected>Brandon Bay</option><option>Keel Beach</option><option>The Burrow</option><option>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Hover (held)</p>
      <div class="wf-control wf-control--select is-hover">
        <select class="wf-control__input" aria-label="Spot"><option>Rusheen Bay</option><option>Dollymount</option><option>Brandon Bay</option><option selected>Keel Beach</option><option>The Burrow</option><option>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Focus-within (held)</p>
      <div class="wf-control wf-control--select is-focus">
        <select class="wf-control__input" aria-label="Spot"><option>Rusheen Bay</option><option selected>Dollymount</option><option>Brandon Bay</option><option>Keel Beach</option><option>The Burrow</option><option>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Active · a filter narrowing the results</p>
      <div class="wf-control wf-control--select wf-control--active">
        <select class="wf-control__input" aria-label="Wing size"><option>Any size</option><option>4 m</option><option>5 m</option><option selected>6 m</option><option>7 m</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Invalid · aria-invalid</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Spot" aria-invalid="true"><option selected>Choose a spot</option><option>Rusheen Bay</option><option>Dollymount</option><option>Brandon Bay</option><option>Keel Beach</option><option>The Burrow</option><option>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>

      <p class="demo__label">Disabled</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Spot" disabled><option>Rusheen Bay</option><option>Dollymount</option><option>Brandon Bay</option><option>Keel Beach</option><option>The Burrow</option><option selected>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
    </section>

    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Select · night chart (proposed)</h2>
      <p class="demo__label">At "any"</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Wing size"><option selected>Any size</option><option>4 m</option><option>5 m</option><option>6 m</option><option>7 m</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
      <p class="demo__label">Active</p>
      <div class="wf-control wf-control--select wf-control--active">
        <select class="wf-control__input" aria-label="Wing size"><option>Any size</option><option>4 m</option><option>5 m</option><option selected>6 m</option><option>7 m</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
      <p class="demo__label">Focus (held)</p>
      <div class="wf-control wf-control--select is-focus">
        <select class="wf-control__input" aria-label="Spot"><option>Rusheen Bay</option><option>Dollymount</option><option>Brandon Bay</option><option>Keel Beach</option><option selected>The Burrow</option><option>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
      <p class="demo__label">Disabled</p>
      <div class="wf-control wf-control--select">
        <select class="wf-control__input" aria-label="Spot" disabled><option>Rusheen Bay</option><option>Dollymount</option><option>Brandon Bay</option><option>Keel Beach</option><option>The Burrow</option><option selected>Donabate</option></select>
        <svg class="wf-control__adornment" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
    </section>
  </body>
</html>
