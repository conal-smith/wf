<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../field/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Select in dark</h2>
      <div class="demo__stack">
        <div class="wf-field">
          <label class="wf-field__label" for="se-d-order">Order</label>
          <div class="wf-select"><select class="wf-select__input" id="se-d-order"><option>Best first</option><option>Nearest</option><option>A to Z</option></select><svg class="wf-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div>
        </div>
        <div class="wf-field">
          <label class="wf-field__label" for="se-d-county">County, an active filter, focused (held)</label>
          <div class="wf-select wf-select--active is-focus"><select class="wf-select__input" id="se-d-county"><option>Any county</option><option selected>Dublin</option><option>Wicklow</option></select><svg class="wf-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div>
        </div>
        <div class="wf-field">
          <label class="wf-field__label" for="se-d-model">Disabled</label>
          <div class="wf-select"><select class="wf-select__input" id="se-d-model" disabled><option>HARMONIE</option></select><svg class="wf-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Select in light</h2>
      <div class="demo__stack">
        <div class="wf-field">
          <label class="wf-field__label" for="se-l-order">Order</label>
          <div class="wf-select"><select class="wf-select__input" id="se-l-order"><option>Best first</option><option>Nearest</option><option>A to Z</option></select><svg class="wf-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div>
        </div>
        <div class="wf-field">
          <label class="wf-field__label" for="se-l-county">County</label>
          <div class="wf-select wf-select--active"><select class="wf-select__input" id="se-l-county"><option>Any county</option><option selected>Dublin</option></select><svg class="wf-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div>
        </div>
      </div>
    </section>
  </body>
</html>
