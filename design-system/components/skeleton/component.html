<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skeleton — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__w-full {
        width: 100%;
      }
      .demo__w-2-3 {
        width: 66%;
      }
      .demo__w-1-3 {
        width: 33%;
      }
      .demo__w-1-4 {
        width: 25%;
      }
      .demo__loading {
        display: flex;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__loading .demo__stack {
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Skeleton in dark</h2>

      <p class="demo__label">Line, square as a line of type is</p>
      <div class="demo__stack" aria-busy="true" aria-label="Loading">
        <span class="wf-skeleton demo__w-full" aria-hidden="true"></span>
        <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
        <span class="wf-skeleton demo__w-1-3" aria-hidden="true"></span>
      </div>

      <p class="demo__label">Block, a photo or a chart</p>
      <span class="wf-skeleton wf-skeleton--block" aria-hidden="true"></span>

      <p class="demo__label">A row loading in a soft card; the holder is aria-busy</p>
      <div class="demo__card demo__loading" aria-busy="true" aria-label="Loading mentions">
        <span class="wf-skeleton wf-skeleton--circle" aria-hidden="true"></span>
        <div class="demo__stack">
          <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
          <span class="wf-skeleton demo__w-1-4" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Skeleton in light</h2>
      <div class="demo__card demo__loading" aria-busy="true" aria-label="Loading mentions">
        <span class="wf-skeleton wf-skeleton--circle" aria-hidden="true"></span>
        <div class="demo__stack">
          <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
          <span class="wf-skeleton demo__w-1-4" aria-hidden="true"></span>
        </div>
      </div>
    </section>
  </body>
</html>
