<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skeleton — wingfoil-chart</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the paper, a mono label per row, and rows. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x5);
        background-color: var(--sem-color-ground);
        background-image: var(--sem-texture-grain);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo + .demo {
        border-top: var(--sem-rule-double) double var(--sem-color-ink);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x3);
        padding-bottom: var(--sem-space-x1);
        border-bottom: var(--sem-rule-heavy) solid var(--sem-color-ink);
        font-family: var(--sem-font-family-display);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-lead);
      }
      .demo__label {
        margin: var(--sem-space-x4) 0 var(--sem-space-x2);
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-eyebrow);
        line-height: var(--sem-font-line-eyebrow);
        font-weight: var(--sem-font-weight-eyebrow);
        letter-spacing: var(--sem-font-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__map {
        padding: var(--sem-space-x3);
        background: var(--sem-color-sea-3);
      }
      /* Demo only: widths a caller would give, and a row laid out as it lands. */
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x2);
      }
      .demo__w-full {
        width: 100%;
      }
      .demo__w-2-3 {
        width: 66.6667%;
      }
      .demo__w-1-3 {
        width: 33.3333%;
      }
      .demo__w-1-4 {
        width: 25%;
      }
      .demo__card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: var(--sem-space-x3);
        padding: var(--sem-space-x4);
        border: var(--sem-rule-hairline) solid var(--sem-color-ink);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="light">
      <h2 class="demo__head">Skeleton</h2>

      <p class="demo__label">shape="line" · square, as a line of type is</p>
      <div class="demo__stack" aria-busy="true">
        <span class="wf-skeleton demo__w-full" aria-hidden="true"></span>
        <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
        <span class="wf-skeleton demo__w-1-3" aria-hidden="true"></span>
      </div>

      <p class="demo__label">shape="block" · a photo, a chart</p>
      <span class="wf-skeleton wf-skeleton--block" aria-hidden="true"></span>

      <p class="demo__label">shape="circle" · an avatar</p>
      <div class="demo__row">
        <span class="wf-skeleton wf-skeleton--circle" aria-hidden="true"></span>
      </div>

      <p class="demo__label">A row loading · the holder is aria-busy</p>
      <div class="demo__card" aria-busy="true" aria-label="Loading mentions">
        <span class="wf-skeleton wf-skeleton--circle" aria-hidden="true"></span>
        <div class="demo__stack">
          <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
          <span class="wf-skeleton demo__w-1-4" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Skeleton · night chart (proposed)</h2>
      <div class="demo__card" aria-busy="true" aria-label="Loading">
        <span class="wf-skeleton wf-skeleton--circle" aria-hidden="true"></span>
        <div class="demo__stack">
          <span class="wf-skeleton demo__w-2-3" aria-hidden="true"></span>
          <span class="wf-skeleton demo__w-1-4" aria-hidden="true"></span>
        </div>
      </div>
      <p class="demo__label">block</p>
      <span class="wf-skeleton wf-skeleton--block" aria-hidden="true"></span>
    </section>
  </body>
</html>
