<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slider — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../field/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Slider in dark</h2>
      <div class="demo__stack">
        <div class="wf-field">
          <label class="wf-field__label" for="sl-d-wind">The strongest wind you like</label>
          <div class="wf-slider">
            <input class="wf-slider__input" id="sl-d-wind" type="range" min="10" max="40" value="25" aria-valuetext="25 knots" style="--wf-slider-fill: 50%" />
            <span class="wf-slider__value" aria-hidden="true">25<small class="wf-slider__unit">kn</small></span>
          </div>
          <small class="wf-field__hint">Hours over it get fewer stars.</small>
        </div>
        <p class="demo__label">Focus (held)</p>
        <div class="wf-slider">
          <input class="wf-slider__input is-focus" type="range" min="0" max="100" value="70" aria-label="How far you will drive" aria-valuetext="70 kilometres" style="--wf-slider-fill: 70%" />
          <span class="wf-slider__value" aria-hidden="true">70<small class="wf-slider__unit">km</small></span>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Slider in light</h2>
      <div class="demo__card demo__stack">
        <div class="wf-field">
          <label class="wf-field__label" for="sl-l-wind">The strongest wind you like</label>
          <div class="wf-slider">
            <input class="wf-slider__input" id="sl-l-wind" type="range" min="10" max="40" value="25" aria-valuetext="25 knots" style="--wf-slider-fill: 50%" />
            <span class="wf-slider__value" aria-hidden="true">25<small class="wf-slider__unit">kn</small></span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
