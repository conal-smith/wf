<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Switch — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Switch in dark</h2>
      <p class="demo__label">Off, on, focus (held), disabled</p>
      <div class="demo__row">
        <button class="wf-switch" type="button" role="switch" aria-checked="false" aria-label="Show tides"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        <button class="wf-switch" type="button" role="switch" aria-checked="true" aria-label="Wind in colour"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        <button class="wf-switch is-focus" type="button" role="switch" aria-checked="true" aria-label="Live wind"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        <button class="wf-switch" type="button" role="switch" aria-checked="false" aria-label="Rain" disabled><span class="wf-switch__thumb" aria-hidden="true"></span></button>
      </div>
      <p class="demo__label">In a soft card, with its words</p>
      <div class="demo__card demo__stack">
        <div class="wf-switch-row">
          <span class="wf-switch-row__words"><span id="sw-d-colour">Wind in colour</span></span>
          <button class="wf-switch" type="button" role="switch" aria-checked="true" aria-labelledby="sw-d-colour"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        </div>
        <div class="wf-switch-row">
          <span class="wf-switch-row__words"><span id="sw-d-live">Live wind</span><span class="wf-switch-row__detail">Buoys and stations, the latest reading</span></span>
          <button class="wf-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-d-live"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        </div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Switch in light</h2>
      <div class="demo__card demo__stack">
        <div class="wf-switch-row">
          <span class="wf-switch-row__words"><span id="sw-l-colour">Wind in colour</span></span>
          <button class="wf-switch" type="button" role="switch" aria-checked="true" aria-labelledby="sw-l-colour"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        </div>
        <div class="wf-switch-row">
          <span class="wf-switch-row__words"><span id="sw-l-live">Live wind</span><span class="wf-switch-row__detail">Buoys and stations, the latest reading</span></span>
          <button class="wf-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-l-live"><span class="wf-switch__thumb" aria-hidden="true"></span></button>
        </div>
      </div>
    </section>
  </body>
</html>
