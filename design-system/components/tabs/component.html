<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabs — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__split {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: var(--sem-space-x5);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Tabs in dark</h2>

      <p class="demo__label">Horizontal</p>
      <div class="wf-tabs" role="tablist" aria-label="Settings" aria-orientation="horizontal">
        <button class="wf-tabs__tab" type="button" role="tab" aria-selected="true" tabindex="0" aria-controls="tabs-dark-riding">Riding</button>
        <button class="wf-tabs__tab" type="button" role="tab" aria-selected="false" tabindex="-1">Units</button>
        <button class="wf-tabs__tab is-hover" type="button" role="tab" aria-selected="false" tabindex="-1">Display</button>
        <button class="wf-tabs__tab is-focus" type="button" role="tab" aria-selected="false" tabindex="-1">Account</button>
      </div>
      <div class="demo__card" id="tabs-dark-riding" role="tabpanel" style="margin-top: var(--sem-space-x3)">Your weight, your wing sizes and the wind you like.</div>

      <p class="demo__label">Vertical, down the side of a wide dialog</p>
      <div class="demo__split">
        <div class="wf-tabs wf-tabs--vertical" role="tablist" aria-label="Settings sections" aria-orientation="vertical">
          <button class="wf-tabs__tab" type="button" role="tab" aria-selected="false" tabindex="-1">Riding</button>
          <button class="wf-tabs__tab" type="button" role="tab" aria-selected="true" tabindex="0">Units</button>
          <button class="wf-tabs__tab" type="button" role="tab" aria-selected="false" tabindex="-1">Display</button>
        </div>
        <div class="demo__card" role="tabpanel">Knots, Beaufort or metres a second.</div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Tabs in light</h2>
      <div class="wf-tabs" role="tablist" aria-label="Settings" aria-orientation="horizontal">
        <button class="wf-tabs__tab" type="button" role="tab" aria-selected="true" tabindex="0">Riding</button>
        <button class="wf-tabs__tab" type="button" role="tab" aria-selected="false" tabindex="-1">Units</button>
        <button class="wf-tabs__tab is-hover" type="button" role="tab" aria-selected="false" tabindex="-1">Display</button>
        <button class="wf-tabs__tab" type="button" role="tab" aria-selected="false" tabindex="-1">Account</button>
      </div>
    </section>
  </body>
</html>
