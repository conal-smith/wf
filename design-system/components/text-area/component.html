<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text area — wingfoil-chart</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../text-input/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the paper, a mono label per row, and rows. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x5);
        background-color: var(--sem-color-ground);
        background-image: var(--sem-texture-grain);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo + .demo {
        border-top: var(--sem-rule-double) double var(--sem-color-ink);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x3);
        padding-bottom: var(--sem-space-x1);
        border-bottom: var(--sem-rule-heavy) solid var(--sem-color-ink);
        font-family: var(--sem-font-family-display);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-lead);
      }
      .demo__label {
        margin: var(--sem-space-x4) 0 var(--sem-space-x2);
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-eyebrow);
        line-height: var(--sem-font-line-eyebrow);
        font-weight: var(--sem-font-weight-eyebrow);
        letter-spacing: var(--sem-font-tracking-eyebrow);
        text-transform: uppercase;
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x3);
      }
      .demo__map {
        padding: var(--sem-space-x3);
        background: var(--sem-color-sea-3);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="light">
      <h2 class="demo__head">Text area</h2>

      <p class="demo__label">Empty · italic placeholder</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" placeholder="What was it like?"></textarea>
      </div>

      <p class="demo__label">Filled</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes">Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>

      <p class="demo__label">Hover (held)</p>
      <div class="wf-control wf-control--area is-hover">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes">Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>

      <p class="demo__label">Focus-within (held)</p>
      <div class="wf-control wf-control--area is-focus">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes">Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>

      <p class="demo__label">Invalid · aria-invalid</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" aria-invalid="true">Grand</textarea>
      </div>

      <p class="demo__label">Disabled</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" disabled>Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>
    </section>

    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Text area · night chart (proposed)</h2>
      <p class="demo__label">Empty</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" placeholder="What was it like?"></textarea>
      </div>
      <p class="demo__label">Focus (held)</p>
      <div class="wf-control wf-control--area is-focus">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes">Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>
      <p class="demo__label">Invalid</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" aria-invalid="true">Grand</textarea>
      </div>
      <p class="demo__label">Disabled</p>
      <div class="wf-control wf-control--area">
        <textarea class="wf-control__input" rows="3" aria-label="Session notes" disabled>Cross-shore WSW, flat inside the bar at low tide. Best 13:00–16:00 on a 6 m.</textarea>
      </div>
    </section>
  </body>
</html>
