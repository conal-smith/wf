<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top bar — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../button/component.css" />
    <link rel="stylesheet" href="../wordmark/component.css" />
    <link rel="stylesheet" href="../spot-search/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__window {
        overflow: hidden;
        border-radius: var(--sem-radius-surface);
        box-shadow: 0 0 0 var(--sem-rule-hairline) var(--sem-color-line);
      }
      .demo__window--narrow {
        max-width: 390px;
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Top bar in dark</h2>
      <p class="demo__label">On a computer</p>
      <div class="demo__window">
        <header class="wf-top-bar ">
          <a class="wf-top-bar__brand" href="#" aria-label="wingfoil.ie, the Spot finder"><span class="wf-wordmark">wingfoil<span class="wf-wordmark__domain">.ie</span></span></a>
          <div class="wf-top-bar__search"><div class="wf-spot-search"><div class="wf-spot-search__field"><svg class="wf-spot-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg><input class="wf-spot-search__input" placeholder="Search spots" aria-label="Search spots" role="combobox" aria-expanded="false" aria-autocomplete="list" /><kbd class="wf-spot-search__key" aria-hidden="true">/</kbd></div></div></div>
          <span class="wf-top-bar__gap"></span>
          <a class="wf-button wf-top-bar__view" href="#" title="The full chart"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z" /><path d="M9 3v15M15 6v15" /></svg><span>Chart</span></a>
          <button class="wf-button wf-button--icon wf-top-bar__theme" type="button" aria-label="Light mode" title="Light mode"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg></button>
          <div class="wf-top-bar__menu"><button class="wf-button wf-button--icon" type="button" aria-label="Menu" aria-haspopup="menu"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button></div>
        </header>
      </div>
      <p class="demo__label">On a phone</p>
      <div class="demo__window demo__window--narrow">
        <header class="wf-top-bar wf-top-bar--phone">
          <a class="wf-top-bar__brand" href="#" aria-label="wingfoil.ie, the Spot finder"><span class="wf-wordmark">wingfoil<span class="wf-wordmark__domain">.ie</span></span></a>
          <div class="wf-top-bar__search"><button class="wf-button wf-button--icon wf-button--quiet" type="button" aria-label="Search spots" aria-expanded="false"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg></button></div>
          <span class="wf-top-bar__gap"></span>
          <a class="wf-button wf-top-bar__view" href="#" title="The full chart"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z" /><path d="M9 3v15M15 6v15" /></svg><span>Chart</span></a>
          <button class="wf-button wf-button--icon wf-top-bar__theme" type="button" aria-label="Light mode" title="Light mode"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg></button>
          <div class="wf-top-bar__menu"><button class="wf-button wf-button--icon" type="button" aria-label="Menu" aria-haspopup="menu"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button></div>
        </header>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Top bar in light</h2>
      <div class="demo__window">
        <header class="wf-top-bar ">
          <a class="wf-top-bar__brand" href="#" aria-label="wingfoil.ie, the Spot finder"><span class="wf-wordmark">wingfoil<span class="wf-wordmark__domain">.ie</span></span></a>
          <div class="wf-top-bar__search"><div class="wf-spot-search"><div class="wf-spot-search__field"><svg class="wf-spot-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg><input class="wf-spot-search__input" placeholder="Search spots" aria-label="Search spots" role="combobox" aria-expanded="false" aria-autocomplete="list" /><kbd class="wf-spot-search__key" aria-hidden="true">/</kbd></div></div></div>
          <span class="wf-top-bar__gap"></span>
          <a class="wf-button wf-top-bar__view" href="#" title="The full chart"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z" /><path d="M9 3v15M15 6v15" /></svg><span>Chart</span></a>
          <button class="wf-button wf-button--icon wf-top-bar__theme" type="button" aria-label="Dark mode" title="Dark mode"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg></button>
          <div class="wf-top-bar__menu"><button class="wf-button wf-button--icon" type="button" aria-label="Menu" aria-haspopup="menu"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button></div>
        </header>
      </div>
      <p class="demo__label">On a phone</p>
      <div class="demo__window demo__window--narrow">
        <header class="wf-top-bar wf-top-bar--phone">
          <a class="wf-top-bar__brand" href="#" aria-label="wingfoil.ie, the Spot finder"><span class="wf-wordmark">wingfoil<span class="wf-wordmark__domain">.ie</span></span></a>
          <div class="wf-top-bar__search"><button class="wf-button wf-button--icon wf-button--quiet" type="button" aria-label="Search spots" aria-expanded="false"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg></button></div>
          <span class="wf-top-bar__gap"></span>
          <a class="wf-button wf-top-bar__view" href="#" title="The full chart"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z" /><path d="M9 3v15M15 6v15" /></svg><span>Chart</span></a>
          <button class="wf-button wf-button--icon wf-top-bar__theme" type="button" aria-label="Dark mode" title="Dark mode"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg></button>
          <div class="wf-top-bar__menu"><button class="wf-button wf-button--icon" type="button" aria-label="Menu" aria-haspopup="menu"><svg class="wf-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button></div>
        </header>
      </div>
    </section>
  </body>
</html>
