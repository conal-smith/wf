<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wind figure — wingfoil</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../shore-compass/component.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      /* Demo scaffolding only: the ground, a grey label over each row, soft cards. */
      body {
        margin: 0;
      }
      .demo {
        padding: var(--sem-space-x6);
        background: var(--sem-color-ground);
        color: var(--sem-color-ink);
        font-family: var(--sem-font-family-body);
        font-size: var(--sem-font-size-prose);
        line-height: var(--sem-font-line-prose);
      }
      .demo__head {
        margin: 0 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-lead);
        line-height: var(--sem-font-line-lead);
        font-weight: var(--sem-font-weight-semibold);
      }
      .demo__label {
        margin: var(--sem-space-x6) 0 var(--sem-space-x2);
        font-size: var(--sem-font-size-label);
        line-height: var(--sem-font-line-label);
        font-weight: var(--sem-font-weight-medium);
        color: var(--sem-color-ink-muted);
      }
      .demo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sem-space-x2);
      }
      .demo__stack {
        display: grid;
        gap: var(--sem-space-x3);
        max-width: var(--sem-container-form);
      }
      .demo__card {
        padding: var(--sem-space-x5);
        border-radius: var(--sem-radius-surface);
        background: var(--sem-color-sunken);
        /* A soft card: a control inside takes the second grey (on-card). */
        --sem-color-well: var(--sem-color-raised);
      }
      .demo__ink {
        display: inline-flex;
        padding: var(--sem-space-x0-5) var(--sem-space-x2);
        border-radius: var(--sem-radius-control);
        background: var(--sem-color-inverse);
      }
      .demo__card {
        display: grid;
        gap: var(--sem-space-x1);
        max-width: 250px;
      }
      .demo__card--after {
        margin-top: var(--sem-space-x3);
      }
    </style>
  </head>
  <body>
    <section class="demo" data-mode="dark">
      <h2 class="demo__head">Wind figure in dark</h2>
      <div class="demo__row">
        <span class="wf-wind-figure" role="img" aria-label="12 knots gusting 21 from the west-south-west"><span class="wf-wind-figure__value">12</span><span class="wf-wind-figure__sup">21</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 247deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">WSW</span></span></span>
        <span class="wf-wind-figure wf-wind-figure--alarm" role="img" aria-label="15 knots gusting 26 from the west-south-west"><span class="wf-wind-figure__value">15</span><span class="wf-wind-figure__sup">26</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 247deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">WSW</span></span></span>
        <span class="wf-wind-figure wf-wind-figure--cell" role="img" aria-label="14 knots gusting 22"><span class="wf-wind-figure__value">14</span><span class="wf-wind-figure__gust">g22</span></span>
      </div>
      <div class="demo__card demo__card--after">
        <div><span class="wf-wind-figure wf-wind-figure--line" role="img" aria-label="13 knots gusting 26 from the west, cross-offshore, 6.5 m wing"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 270deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__value">13</span><span class="wf-wind-figure__gust">g26</span><span class="wf-wind-figure__point">W</span><svg class="wf-shore-compass wf-shore-compass--wind wf-shore-compass--cross-off" viewBox="-9 -9 18 18" role="img" aria-label="cross-offshore" style="--facing: 123deg; --from: 270deg"><title>cross-offshore</title><rect class="wf-shore-compass__land" x="-9" y="4.2" width="18" height="4.8" /><path class="wf-shore-compass__hatch" d="M-6.5 4.2l-4.6 4.6M-4 4.2l-4.6 4.6M-1.5 4.2l-4.6 4.6M1 4.2l-4.6 4.6M3.5 4.2l-4.6 4.6M6 4.2l-4.6 4.6M8.5 4.2l-4.6 4.6M11 4.2l-4.6 4.6M13.5 4.2l-4.6 4.6" /><path class="wf-shore-compass__shore" d="M-9 4.2H9" /><g class="wf-shore-compass__wind"><path class="wf-shore-compass__arrow" d="M0 5V-5.2M-2.6 -2.3L0 -5.5L2.6 -2.3" /></g></svg><span class="wf-wind-figure__sep">·</span><span><span class="wf-wind-figure__wing">6.5</span> m</span></span></div>
      </div>
    </section>

    <section class="demo" data-mode="light">
      <h2 class="demo__head">Wind figure in light</h2>

      <p class="demo__label">Row, a spot page: the mean, the gust raised, downwind</p>
      <div class="demo__row">
        <span class="wf-wind-figure" role="img" aria-label="12 knots gusting 21 from the west-south-west"><span class="wf-wind-figure__value">12</span><span class="wf-wind-figure__sup">21</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 247deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">WSW</span></span></span>
        <span class="wf-wind-figure" role="img" aria-label="11 knots gusting 19 from the south-west"><span class="wf-wind-figure__value">11</span><span class="wf-wind-figure__sup">19</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 225deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">SW</span></span></span>
        <span class="wf-wind-figure" role="img" aria-label="13 knots gusting 19 from the north"><span class="wf-wind-figure__value">13</span><span class="wf-wind-figure__sup">19</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 0deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">N</span></span></span>
      </div>

      <p class="demo__label">Alarm: a big jump in the gust</p>
      <div class="demo__row">
        <span class="wf-wind-figure wf-wind-figure--alarm" role="img" aria-label="12 knots gusting 19 from the north"><span class="wf-wind-figure__value">12</span><span class="wf-wind-figure__sup">19</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 0deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">N</span></span></span>
        <span class="wf-wind-figure wf-wind-figure--alarm" role="img" aria-label="15 knots gusting 26 from the west-south-west"><span class="wf-wind-figure__value">15</span><span class="wf-wind-figure__sup">26</span><span class="wf-wind-figure__dir"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 247deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__point">WSW</span></span></span>
      </div>

      <p class="demo__label">Cell: the dock</p>
      <div class="demo__row">
        <span class="wf-wind-figure wf-wind-figure--cell" role="img" aria-label="14 knots gusting 22"><span class="wf-wind-figure__value">14</span><span class="wf-wind-figure__gust">g22</span></span>
        <span class="wf-wind-figure wf-wind-figure--cell" role="img" aria-label="13 knots gusting 21"><span class="wf-wind-figure__value">13</span><span class="wf-wind-figure__gust">g21</span></span>
        <span class="wf-wind-figure wf-wind-figure--cell" role="img" aria-label="8 knots gusting 15"><span class="wf-wind-figure__value">8</span><span class="wf-wind-figure__gust">g15</span></span>
        <span class="demo__ink"><span class="wf-wind-figure wf-wind-figure--cell wf-wind-figure--inverse" role="img" aria-label="14 knots gusting 22"><span class="wf-wind-figure__value">14</span><span class="wf-wind-figure__gust">g22</span></span></span>
      </div>

      <p class="demo__label">Line: the popup</p>
      <div class="demo__card">
        <div><span class="wf-wind-figure wf-wind-figure--line" role="img" aria-label="13 knots gusting 26 from the west, cross-offshore, 6.5 m wing"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 270deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__value">13</span><span class="wf-wind-figure__gust">g26</span><span class="wf-wind-figure__point">W</span><svg class="wf-shore-compass wf-shore-compass--wind wf-shore-compass--cross-off" viewBox="-9 -9 18 18" role="img" aria-label="cross-offshore" style="--facing: 123deg; --from: 270deg"><title>cross-offshore</title><rect class="wf-shore-compass__land" x="-9" y="4.2" width="18" height="4.8" /><path class="wf-shore-compass__hatch" d="M-6.5 4.2l-4.6 4.6M-4 4.2l-4.6 4.6M-1.5 4.2l-4.6 4.6M1 4.2l-4.6 4.6M3.5 4.2l-4.6 4.6M6 4.2l-4.6 4.6M8.5 4.2l-4.6 4.6M11 4.2l-4.6 4.6M13.5 4.2l-4.6 4.6" /><path class="wf-shore-compass__shore" d="M-9 4.2H9" /><g class="wf-shore-compass__wind"><path class="wf-shore-compass__arrow" d="M0 5V-5.2M-2.6 -2.3L0 -5.5L2.6 -2.3" /></g></svg><span class="wf-wind-figure__sep">·</span><span><span class="wf-wind-figure__wing">6.5</span> m</span></span></div>
        <div><span class="wf-wind-figure wf-wind-figure--line" role="img" aria-label="13 knots gusting 19 from the north, cross-offshore, 6.5 m wing"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 0deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__value">13</span><span class="wf-wind-figure__gust">g19</span><span class="wf-wind-figure__point">N</span><svg class="wf-shore-compass wf-shore-compass--wind wf-shore-compass--cross-off" viewBox="-9 -9 18 18" role="img" aria-label="cross-offshore" style="--facing: 247deg; --from: 0deg"><title>cross-offshore</title><rect class="wf-shore-compass__land" x="-9" y="4.2" width="18" height="4.8" /><path class="wf-shore-compass__hatch" d="M-6.5 4.2l-4.6 4.6M-4 4.2l-4.6 4.6M-1.5 4.2l-4.6 4.6M1 4.2l-4.6 4.6M3.5 4.2l-4.6 4.6M6 4.2l-4.6 4.6M8.5 4.2l-4.6 4.6M11 4.2l-4.6 4.6M13.5 4.2l-4.6 4.6" /><path class="wf-shore-compass__shore" d="M-9 4.2H9" /><g class="wf-shore-compass__wind"><path class="wf-shore-compass__arrow" d="M0 5V-5.2M-2.6 -2.3L0 -5.5L2.6 -2.3" /></g></svg><span class="wf-wind-figure__sep">·</span><span><span class="wf-wind-figure__wing">6.5</span> m</span></span></div>
        <div><span class="wf-wind-figure wf-wind-figure--line" role="img" aria-label="14 knots gusting 22 from the west-south-west, onshore, 6 m wing"><svg class="wf-wind-figure__arrow" viewBox="-7 -7 14 14" aria-hidden="true" style="--from: 247deg"><g class="wf-wind-figure__arrow-turn"><path class="wf-wind-figure__arrow-path" d="M0 5.5V-5.2M-3 -1.8L0 -5.6L3 -1.8" /></g></svg><span class="wf-wind-figure__value">14</span><span class="wf-wind-figure__gust">g22</span><span class="wf-wind-figure__point">WSW</span><svg class="wf-shore-compass wf-shore-compass--wind wf-shore-compass--onshore" viewBox="-9 -9 18 18" role="img" aria-label="onshore" style="--facing: 247deg; --from: 247deg"><title>onshore</title><rect class="wf-shore-compass__land" x="-9" y="4.2" width="18" height="4.8" /><path class="wf-shore-compass__hatch" d="M-6.5 4.2l-4.6 4.6M-4 4.2l-4.6 4.6M-1.5 4.2l-4.6 4.6M1 4.2l-4.6 4.6M3.5 4.2l-4.6 4.6M6 4.2l-4.6 4.6M8.5 4.2l-4.6 4.6M11 4.2l-4.6 4.6M13.5 4.2l-4.6 4.6" /><path class="wf-shore-compass__shore" d="M-9 4.2H9" /><g class="wf-shore-compass__wind"><path class="wf-shore-compass__arrow" d="M0 5V-5.2M-2.6 -2.3L0 -5.5L2.6 -2.3" /></g></svg><span class="wf-wind-figure__sep">·</span><span><span class="wf-wind-figure__wing">6</span> m</span></span></div>
      </div>
    </section>
  </body>
</html>
