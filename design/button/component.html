<!doctype html>
<meta charset="utf-8" />
<title>Button - Force5</title>
<link rel="stylesheet" href="../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  /* Demo scaffolding only. Nothing here is part of the component. */
  body { margin: 0; font: 400 12px/1.5 "DM Sans", system-ui, sans-serif; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 700px) { .modes { grid-template-columns: 1fr; } }
  .mode {
    padding: 24px; min-height: 100vh;
    background:
      linear-gradient(135deg, #0000 0 49%, #ffffff14 50% 51%, #0000 52%),
      var(--sem-color-bg-page);
  }
  .mode > h3 {
    margin: 0 0 16px; text-transform: uppercase;
    font: var(--sem-text-eyebrow-font-weight) var(--sem-text-eyebrow-font-size) /
      var(--sem-text-eyebrow-line-height) var(--sem-text-eyebrow-font-family);
    letter-spacing: var(--sem-text-eyebrow-letter-spacing);
    color: var(--sem-color-text-muted);
  }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cap {
    font-size: var(--sem-text-caption-font-size);
    color: var(--sem-color-text-muted); margin: 0 0 6px;
  }
  .pane {
    background: var(--sem-color-surface-solid);
    border-radius: var(--sem-radius-surface);
    padding: 16px;
  }
.is-hover.f5-button { background-color: var(--sem-color-action-quiet-hover); }
  .is-hover.f5-button--primary { background-color: var(--sem-color-action-bg-hover); }
  .is-hover.f5-button--link { background: none; color: var(--sem-color-text-primary); }
  .is-focus.f5-button {
    outline: var(--sem-stroke-focus-width) solid var(--sem-color-action-focus);
    outline-offset: var(--sem-stroke-focus-offset);
  }
</style>

<div class="modes">
  <section class="mode" data-mode="light">
    <h3>Light</h3>
    <div class="stack">
      <div>
        <p class="cap">Variants &mdash; resting</p>
        <div class="pane row">
          <button class="f5-button">Layers</button>
          <button class="f5-button f5-button--primary">Play</button>
          <button class="f5-button f5-button--pill">Now</button>
          <button class="f5-button f5-button--icon" aria-label="Zoom in">+</button>
          <button class="f5-button f5-button--link">Retry</button>
        </div>
      </div>
      <div>
        <p class="cap">Sizes &mdash; sm 30, md 40, lg 46</p>
        <div class="pane row">
          <button class="f5-button f5-button--pill f5-button--sm">Now</button>
          <button class="f5-button f5-button--pill">Now</button>
          <button class="f5-button f5-button--pill f5-button--lg">Now</button>
        </div>
      </div>
      <div>
        <p class="cap">Hover &mdash; forced</p>
        <div class="pane row">
          <button class="f5-button is-hover">Layers</button>
          <button class="f5-button f5-button--primary is-hover">Play</button>
          <button class="f5-button f5-button--pill is-hover">Now</button>
          <button class="f5-button f5-button--link is-hover">Retry</button>
        </div>
      </div>
      <div>
        <p class="cap">:focus-visible &mdash; forced</p>
        <div class="pane row">
          <button class="f5-button is-focus">Layers</button>
          <button class="f5-button f5-button--primary is-focus">Play</button>
          <button class="f5-button f5-button--pill is-focus">Now</button>
          <button class="f5-button f5-button--icon is-focus" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div>
        <p class="cap">aria-pressed="true"</p>
        <div class="pane row">
          <button class="f5-button" aria-pressed="true">kn</button>
          <button class="f5-button" aria-pressed="false">m/s</button>
        </div>
      </div>
      <div>
        <p class="cap">:disabled</p>
        <div class="pane row">
          <button class="f5-button" disabled>Layers</button>
          <button class="f5-button f5-button--primary" disabled>Play</button>
          <button class="f5-button f5-button--pill" disabled>Now</button>
        </div>
      </div>
    </div>
  </section>
  <section class="mode" data-mode="dark">
    <h3>Dark</h3>
    <div class="stack">
      <div>
        <p class="cap">Variants &mdash; resting</p>
        <div class="pane row">
          <button class="f5-button">Layers</button>
          <button class="f5-button f5-button--primary">Play</button>
          <button class="f5-button f5-button--pill">Now</button>
          <button class="f5-button f5-button--icon" aria-label="Zoom in">+</button>
          <button class="f5-button f5-button--link">Retry</button>
        </div>
      </div>
      <div>
        <p class="cap">Sizes &mdash; sm 30, md 40, lg 46</p>
        <div class="pane row">
          <button class="f5-button f5-button--pill f5-button--sm">Now</button>
          <button class="f5-button f5-button--pill">Now</button>
          <button class="f5-button f5-button--pill f5-button--lg">Now</button>
        </div>
      </div>
      <div>
        <p class="cap">Hover &mdash; forced</p>
        <div class="pane row">
          <button class="f5-button is-hover">Layers</button>
          <button class="f5-button f5-button--primary is-hover">Play</button>
          <button class="f5-button f5-button--pill is-hover">Now</button>
          <button class="f5-button f5-button--link is-hover">Retry</button>
        </div>
      </div>
      <div>
        <p class="cap">:focus-visible &mdash; forced</p>
        <div class="pane row">
          <button class="f5-button is-focus">Layers</button>
          <button class="f5-button f5-button--primary is-focus">Play</button>
          <button class="f5-button f5-button--pill is-focus">Now</button>
          <button class="f5-button f5-button--icon is-focus" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div>
        <p class="cap">aria-pressed="true"</p>
        <div class="pane row">
          <button class="f5-button" aria-pressed="true">kn</button>
          <button class="f5-button" aria-pressed="false">m/s</button>
        </div>
      </div>
      <div>
        <p class="cap">:disabled</p>
        <div class="pane row">
          <button class="f5-button" disabled>Layers</button>
          <button class="f5-button f5-button--primary" disabled>Play</button>
          <button class="f5-button f5-button--pill" disabled>Now</button>
        </div>
      </div>
    </div>
  </section>
</div>
