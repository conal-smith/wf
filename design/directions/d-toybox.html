  s+=`<g font-family="Nunito" font-weight="800" font-size="13" fill="${C.ink}"><text x="${x(sr)}" y="${B-8}" text-anchor="middle" fill="${C.paper}" stroke="${C.ink}" stroke-width="3" paint-order="stroke">↑ ${hhmm(sr)}</text><text x="${x(ss)}" y="${B-8}" text-anchor="middle" fill="${C.paper}" stroke="${C.ink}" stroke-width="3" paint-order="stroke">${hhmm(ss)} ↓</text></g>`;
  let lo=0,hi=1;
  if(ev){lo=Math.min(...ev.map(e=>e.h))-.5;hi=Math.max(...ev.map(e=>e.h))+.4;
    const y=v=>B-(v-lo)/(hi-lo)*(B-78);
    let pts=[],segs=[],cur=null;
    for(let m=0;m<=96;m++){const t=d*24+m/4,v=tideAt(ev,t);pts.push([x(m/4),y(v.h)]);if(!cur||cur.est!==v.est){cur={est:v.est,p:cur?[cur.p[cur.p.length-1]]:[]};segs.push(cur);}cur.p.push([x(m/4),y(v.h)]);}
    s+=`<path d="M${pts.map(P2).join('L')}L${x(24)} ${B}L${x(0)} ${B}Z" fill="${C.teal}" opacity=".88"/><path d="M${pts.map(P2).join('L')}L${x(24)} ${B}L${x(0)} ${B}Z" fill="url(#waveHatch)"/>`;
    segs.forEach(sg=>{s+=`<path d="M${sg.p.map(P2).join('L')}" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" ${sg.est?'stroke-dasharray="7 7"':''} filter="url(#rough)"/>`;});
    ev.filter(e=>e.t>=d*24&&e.t<=d*24+24).forEach(e=>{const ex=x(e.t-d*24),ey=y(e.h);const up=e.type==='high';
      s+=`<circle cx="${ex}" cy="${ey}" r="6" fill="${up?C.pink:C.yellow}" stroke="${C.ink}" stroke-width="2.2"/>
      <g transform="translate(${clamp(ex,90,W-80)} ${ey-(up?30:26)})"><rect x="-62" y="-16" width="124" height="24" rx="12" fill="${C.paper}" stroke="${C.ink}" stroke-width="2"/><text y="1" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="${C.ink}">${e.est?'~':''}${up?'High':'Low'} ${hhmm(e.t-d*24)} · ${e.h.toFixed(1)} m</text></g>`;});
  }
  // ratings ribbon
  s+=`<text x="${L-6}" y="${B+24}" text-anchor="end" font-family="Nunito" font-weight="800" font-size="11" fill="${C.ink}">★</text>`;
  for(let h=0;h<24;h++){const x0=x(h)+1.5,w=x(1)-x(0)-3;const r=hrs[h]&&hrs[h].rating;
    if(r){const col=r.stars>=4?C.pink:r.stars===3?C.teal:r.stars>=1?'#9EB4D6':C.paper2;s+=`<rect x="${x0}" y="${B+10}" width="${w}" height="20" rx="4" fill="${col}" stroke="${C.ink}" stroke-width="1.4"/><text x="${x0+w/2}" y="${B+24.5}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="11.5" fill="${r.stars>=3?'#fff':C.ink}">${r.stars}</text>`;}
    else s+=`<rect x="${x0}" y="${B+10}" width="${w}" height="20" rx="4" fill="none" stroke="${C.ink}" stroke-width="1" stroke-dasharray="2 3" opacity=".35"/>`;}
  for(let h=0;h<=24;h+=3) s+=`<text x="${x(h)}" y="${B+52}" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12.5" fill="${C.ink}" opacity=".75">${String(h%24).padStart(2,'0')}:00</text>`;
  s+=`<line id="tideX" x1="0" x2="0" y1="10" y2="${B+30}" stroke="${C.pink}" stroke-width="2.5" opacity="0"/><rect id="tideHit" x="${L}" y="0" width="${W-L-R}" height="${B+34}" fill="transparent"/>`;
  s+='</svg>';
  const note = !ev?`<p class="tidenote">${esc(f.tides&&f.tides.note||'No tide predictions here.')} Puffin still shades the dark hours and marks the rated ones.</p>`:
    `<p class="tidenote">Solid line: Marine Institute predictions${f.tides.distance_km?` (${esc(f.tides.station)}, ${f.tides.distance_km} km away)`:''}. Dashed: Puffin carrying the ${'12h 25m'} rhythm on past the published tables. Yellow columns: the day’s best-rated hours.</p>`;
  return s+note;
}
function ticket(f,d){
  const {sr,ss}=sunTimes(f,d);const ev=tideEvents(f);const di=dinfo(d);
  const tl=ev?ev.filter(e=>e.t>=d*24&&e.t<d*24+24).map(e=>`<li><span>${e.type==='high'?'High':'Low'}${e.est?' ~':''}</span><b>${hhmm(e.t-d*24)}</b><span>${e.h.toFixed(2)} m</span></li>`).join(''):'<li><span>No tide station</span></li>';
  const len=ss-sr;
  return `<div class="ticket" role="group" aria-label="Tide and sun tables"><span class="notch t"></span><span class="notch b"></span>
    <div class="stub"><small>Admit one rider</small><b>${di.w3} ${di.dom} ${di.mo}</b><small>No. ${String(d+1).padStart(3,'0')}${String(di.dom).padStart(2,'0')}</small></div>
    <div><h3>Tides${f.tides&&f.tides.station?` · ${esc(f.tides.station)}`:''}</h3><ul>${tl}</ul>${ev&&ev.some(e=>e.est&&e.t>=d*24&&e.t<d*24+24)?'<p class="fine">~ estimated past the published tables</p>':''}</div>
    <div><h3>Sun</h3><ul><li><span>Sunrise</span><b>${hhmm(sr)}</b></li><li><span>Sunset</span><b>${hhmm(ss)}</b></li><li><span>Daylight</span><b>${Math.floor(len)}h ${String(Math.round((len%1)*60)).padStart(2,'0')}m</b></li></ul></div>
    <div><h3>Water</h3><ul>${f.sea_temperature?`<li><span>Sea</span><b>${f.sea_temperature.celsius}°C</b></li><li><span>Buoy</span><span>${esc(f.sea_temperature.station)}</span></li><li><span>Suit</span><b>${f.sea_temperature.celsius>=15?'4/3 + boots':'5/4 + hood'}</b></li>`:`<li><span>Sea temp</span><span>no nearby buoy</span></li><li><span>Suit</span><b>4/3 + boots</b></li>`}</ul></div>
  </div>`;
}
function communityBlock(s){
  const nm=esc(s.name.split(' — ')[0]);
  return `<div class="sec-h"><div><h2 class="riso" data-text="Around ${nm}">Around ${nm}</h2><p>Community and marketplace, coming soon. Here’s a taste.</p></div></div>
  <div class="community">
    <div class="note" style="--r:-1.5deg"><b>Checked in: 3 riders this week</b>“Launched from the car park end, lovely reach at mid tide.”<small>Community · Ciarán, Sat</small></div>
    <div class="note y" style="--r:1.2deg"><b>Lift share from ${esc(s.county)}</b>Two seats Saturday morning, wings fit on the roof.<small>Community · Niamh</small></div>
    <div class="note" style="--r:-.6deg"><b>Foil, 1100 cm², €390</b>Front wing + stab, mast not included. Collect near ${nm}.<small>Marketplace</small></div>
  </div>`;
}
function litePage(s,day){
  const sp=byId[s.id];
  const near=Object.values(F).map(f=>f.spot).sort((a,b)=>Math.hypot(a.lat-s.lat,(a.lon-s.lon)*.6)-Math.hypot(b.lat-s.lat,(b.lon-s.lon)*.6))[0];
  const panels=sp.days.map((d,i)=>{const b=d.best;const di=dinfo(i);
    if(!b) return `<figure class="panel night" data-h="${i}"><span class="tm">${di.w3}</span><svg class="scene" viewBox="0 0 200 210">${sceneSVG({hour:23,night:true,sr:7.8,ss:19})}</svg><figcaption class="cap"><div class="sess">No rated hours</div></figcaption></figure>`;
    const dd=cdeg(b.dir);const across=acrossSign(dd,s.facing);
    const sc=sceneSVG({hour:hm(b.at),night:false,sr:7.8,ss:19,cloud:40,rain:0,wave:.5,stars:b.stars,wing:null,tilt:clamp(across*10,-10,10),flip:across<-.15,gx:across,seed:s.id.length*5});
    return `<figure class="panel s${b.stars}${i===day?' focus':''}" data-h="${i}" style="--dl:${i*.08}s;--sr:${[-7,5,-3,8,-5][i]}deg">
      <span class="tm">${i===0?'Today':di.w3} · ${b.at}</span><svg class="scene" viewBox="0 0 200 210" aria-hidden="true">${sc}</svg>
      <span class="stamp">${stars(b.stars,b.stars,14)}<b>${stampWord(b.stars)}</b></span>
      ${b.stars>=4?`<span class="sendit">${sendSVG}</span>`:''}
      <figcaption class="cap"><div class="sess">${sessionFor(b.stars)}</div><div class="ride">best hour ${b.at}</div><div class="nums">${arrowSVG(dd)}<span><b>${r1(b.wind)}</b>–${r1(b.gust)} kn ${b.dir}</span></div><div class="tiny">noon: ${r1(d.noon.wind)} kn ${compass(d.noon.dir)}</div></figcaption></figure>`;}).join('');
  return heroBlock(s,null,day)+postcards(s,null,day)+`
   <div class="sec-h" id="stripTitle"><div><h2 class="riso" data-text="The week strip">The week strip</h2><p>One panel per day, drawn at its best hour.</p></div></div>
   <div class="stripbox"><div class="strip" id="strip" tabindex="0">${panels}</div></div>
   <div class="lite"><p>Puffin draws the full hourly comic, tide wave and ticket stub for our featured spots. The nearest one to ${esc(s.name)} is <b>${esc(near.name)}</b>.</p><a class="go" href="#spot/${near.id}/${day}">Open ${esc(near.name.split(' — ')[0])} →</a></div>
   ${communityBlock(s)}
   <p class="foot">Forecast: ${esc(WF.generated)}</p>`;
}
function wireSpot(el,f){
  el.querySelectorAll('.pc').forEach(b=>b.addEventListener('click',()=>{location.hash=`#spot/${spotState.id}/${b.dataset.day}`;}));
  el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{spotState.mode=b.dataset.mode;el.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));const sb=el.querySelector('.stripbox'),nw=el.querySelector('.numwrap');if(sb)sb.hidden=spotState.mode!=='comic';if(nw)nw.hidden=spotState.mode!=='table';observeStamps();}));
  el.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>{const st=$('#strip');st.scrollBy({left:+b.dataset.scroll*st.clientWidth*.8,behavior:RM?'auto':'smooth'});}));
  const svg=el.querySelector('#tideSvg');
  if(svg&&f){const hit=svg.querySelector('#tideHit'),line=svg.querySelector('#tideX'),tt=$('#tt'),box=$('#tidebox');const ev=tideEvents(f);const d=spotState.day;
    hit.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*1000;const h=clamp((vx-40)/940*24,0,24);
      line.setAttribute('x1',vx);line.setAttribute('x2',vx);line.setAttribute('opacity',1);
      const hr=DH[spotState.id][d][Math.round(h)];const rt=hr&&hr.rating;
      const td=ev?tideAt(ev,d*24+h):null;
      tt.innerHTML=`<b>${hhmm(h)}</b>${td?` · tide ${td.est?'~':''}${td.h.toFixed(1)} m`:''}<br>${rt?`${stars(rt.stars,rt.potential,11)} ${esc(rt.session)} · ${rt.wing} m²`:'unrated (dark)'}`;
      const br=box.getBoundingClientRect();tt.style.left=(e.clientX-br.left)+'px';tt.style.top=(e.clientY-br.top)+'px';tt.style.display='block';});
    hit.addEventListener('pointerleave',()=>{tt.style.display='none';line.setAttribute('opacity',0);});
  }
}
let io=null;
function observeStamps(){
  if(RM||!('IntersectionObserver' in window)){$$('.panel').forEach(p=>p.classList.add('landed'));return;}
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('landed');io.unobserve(e.target);}}),{threshold:.35});
  $$('.panel').forEach(p=>io.observe(p));
}

/* ================= PUFFIN / CHAT ================= */
let mood={};
function setMood(m){
  mood=m;$('#puffin').innerHTML=puffinSVG(m);
  const b=$('#pfBubble');b.textContent=m.line||'';
  if(!chatOpen&&m.line){b.classList.remove('hide');clearTimeout(setMood.t);setMood.t=setTimeout(()=>b.classList.add('hide'),7000);}
}
let chatOpen=false, scripted=false;
function openChat(fromRoute){
  chatOpen=true;$('#chat').classList.remove('closed');$('#puffin').setAttribute('aria-expanded','true');$('#pfBubble').classList.add('hide');
  const p=$('#puffin');p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop');
  renderChips();
  if(!scripted){scripted=true;runScript();}
  setTimeout(()=>$('#chatIn').focus({preventScroll:true}),RM?0:350);
}
function closeChat(silent){
  chatOpen=false;$('#chat').classList.add('closed');$('#puffin').setAttribute('aria-expanded','false');
  if(!silent&&location.hash==='#companion') history.replaceState(null,'',curView==='spot'?`#spot/${spotState.id}/${spotState.day}`:'#map');
}
const avatar=()=>`<span class="av">${puffinSVG({face:'happy'},true).replace('viewBox="0 0 160 190"','viewBox="40 20 82 80"')}</span>`;
function addMe(t){const d=document.createElement('div');d.className='msg me';d.textContent=t;$('#chatLog').appendChild(d);scrollLog();}
function addPf(html){const d=document.createElement('div');d.className='msg pf';d.innerHTML=avatar()+`<div>${html}</div>`;$('#chatLog').appendChild(d);scrollLog();return d;}
function scrollLog(){const l=$('#chatLog');l.scrollTop=l.scrollHeight;}
function typing(){const d=document.createElement('div');d.className='msg pf';d.innerHTML=avatar()+'<div><span class="typing" aria-label="Puffin is thinking"><i></i><i></i><i></i></span></div>';$('#chatLog').appendChild(d);scrollLog();return d;}
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
async function ask(q,fn){addMe(q);const t=typing();await wait(850);t.remove();addPf(fn());}
function ansBestTomorrow(){
  const d=1,di=dinfo(d),top=ranked(d).slice(0,3);const n4=SPOTS.filter(s=>bestOf(s,d)>=4);const kerry=n4.filter(s=>s.county===top[0].county).length;
  return `<span class="sign">TOMORROW → ${esc(top[0].county.toUpperCase())}<small>${di.wd} ${di.dom} ${di.mo} · ranked by best hour</small></span>
   <div class="cards">${top.map(s=>{const b=s.days[d].best;return `<div class="scard"><span class="disc">${discSVG(b.stars)}</span><div><div class="nm">${esc(s.name)}</div>${stars(b.stars,b.stars,13)}<div class="meta">${b.at} · ${r1(b.wind)}–${r1(b.gust)} kn ${b.dir}</div></div><a class="go" href="#spot/${s.id}/${d}">Take me there</a></div>`;}).join('')}</div>
   <p class="aside">${n4.length} spots hit 4★+ tomorrow; ${kerry} are in ${esc(top[0].county)}. It peaks late: ${top[0].days[d].best.at}.</p>`;
}
function ansWing(){
  const h=DH.brandon[1][14],r=h.rating;const all=Object.entries(DH.brandon[1]).filter(([k,v])=>v.rating);const best=all.sort((a,b)=>b[1].rating.stars-a[1].rating.stars||a[0]-b[0])[0];
  const R=34;const w=wingSVG(60,62,0,R,C.pink);
  return `<span class="sign">BRANDON · TUE 2PM<small>${esc(r.session)}</small></span>
   <div class="wingcard"><svg viewBox="18 8 84 72" aria-hidden="true"><g filter="url(#misreg)">${w.svg}</g><text x="60" y="76" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="8" fill="${C.ink}">drawn to size</text></svg>
    <div><div class="big">${r.wing}<small> m²</small></div>${stars(r.stars,r.potential,15)}
    <ul><li>${r1(h.wind.kn)} kn, gusting ${r1(h.wind.gust)}, from ${h.wind.compass}</li><li>${shoreTxt(r.shore)}</li><li>Rides like ${r1(r.rideKn)} kn with the gusts</li></ul></div></div>
   <div class="minicard"><span>Wait for <b>${hhmm(+best[0])}</b>: ${best[1].rating.stars}★ on a ${best[1].rating.wing} m²</span><a class="go alt" href="#spot/brandon/1/${best[0]}">Show me</a></div>`;
}
function ansSuit(){
  const d=F.dollymount.sea_temperature,r=F.rusheen.sea_temperature;
  return `<span class="sign">SEA’S ${d.celsius}°C<small>Buoys ${esc(d.station)} &amp; ${esc(r.station)}</small></span>
   <div class="cards"><div class="scard"><span class="disc">${discSVG(3)}</span><div><div class="nm">4/3 full suit</div><div class="meta">Dollymount ${d.celsius}°C · Rusheen ${r.celsius}°C</div></div><span class="pill y">+ boots</span></div></div>
   ${(()=>{const c=[0,1,2,3,4].map(i=>[i,dayMood(i).tmin]).filter(x=>x[1]!=null).sort((x,y)=>x[1]-y[1])[0];return c?`<p class="aside">${dinfo(c[0]).wd} dips to ${c[1]}°C on the beach. I’ll be in my beanie.</p>`:'';})()}`;
}
const QS=[["Where’s best tomorrow?",ansBestTomorrow],["What wing at Brandon at 2pm?",ansWing],["What wetsuit this week?",ansSuit]];
function renderChips(){$('#chips').innerHTML=QS.map((q,i)=>`<button class="chip" data-q="${i}">${q[0]}</button>`).join('');}
async function runScript(){
  $('#chatLog').innerHTML='';
  addPf(`<span class="sign">HIYA! I’M PUFFIN<small>I read the forecast so you can read the sea</small></span>`);
  await wait(500);await ask(QS[0][0],QS[0][1]);await wait(700);await ask(QS[1][0],QS[1][1]);
}
function wireChat(){
  $('#puffin').addEventListener('click',()=>{if(chatOpen){closeChat();}else{location.hash='#companion';}});
  $('#chatX').addEventListener('click',()=>closeChat());
  $('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){const q=QS[+b.dataset.q];ask(q[0],q[1]);}});
  $('#chatF').addEventListener('submit',e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;$('#chatIn').value='';ask(v,()=>`<span class="sign">I’M A DEMO PUFFIN!<small>Try one of these</small></span><p class="aside">In the real thing I’ll answer “${esc(v.slice(0,60))}” with cards like the ones above.</p>`);});
  $('#chatLog').addEventListener('click',e=>{const a=e.target.closest('a.go');if(a){closeChat(true);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&chatOpen){closeChat();$('#puffin').focus();}});
}

/* ================= ROUTER ================= */
let curView=null;
function show(v){
  curView=v;$('#view-map').classList.toggle('on',v==='map');$('#view-spot').classList.toggle('on',v==='spot');
  $$('.nav a[data-nav="forecast"], .mobnav a[href="#map"]').forEach(a=>a.classList.toggle('on',true));
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'map';const p=h.split('/');
  if(p[0]==='spot'&&p[1]){const was=curView;show('spot');showSpot(p[1],p[2]!=null?+p[2]:null,p[3]!=null?+p[3]:null);if(p[3]==null) scrollTo(0,0);closeChat(true);}
  else if(p[0]==='companion'){if(!curView){show('map');setMapDay(mapDay);}openChat(true);}
  else {const first=curView!=='map';show('map');if(first){scrollTo(0,0);placePins();setMood(mapMood());}closeChat(true);}
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hide'),2600);}
document.addEventListener('click',e=>{const a=e.target.closest('[data-soon]');if(a){e.preventDefault();toast(`${a.dataset.soon} is coming soon. Puffin’s pinning up the noticeboard.`);}});

/* ================= INIT ================= */
buildMap();setField(0);initSquiggles();buildRibbon();wireMap();wireChat();
setMapDay(0);
addEventListener('hashchange',route);
route();
})();
</script>
