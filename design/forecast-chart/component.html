<!doctype html>
<meta charset="utf-8" />
<title>Forecast chart - Force5</title>
<link rel="stylesheet" href="../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  /* Demo scaffolding only. Nothing here is part of the component. */
  body {
    margin: 0;
    font:
      400 12px/1.5 "DM Sans",
      system-ui,
      sans-serif;
  }
  .modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 900px) {
    .modes {
      grid-template-columns: 1fr;
    }
  }
  .mode {
    padding: 24px;
    min-height: 100vh;
    background:
      linear-gradient(135deg, #0000 0 49%, #ffffff14 50% 51%, #0000 52%),
      var(--sem-color-bg-page);
  }
  .mode > h3 {
    margin: 0 0 16px;
    text-transform: uppercase;
    font: var(--sem-text-eyebrow-font-weight)
      var(--sem-text-eyebrow-font-size) / var(--sem-text-eyebrow-line-height)
      var(--sem-text-eyebrow-font-family);
    letter-spacing: var(--sem-text-eyebrow-letter-spacing);
    color: var(--sem-color-text-muted);
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .cap {
    font-size: var(--sem-text-caption-font-size);
    color: var(--sem-color-text-muted);
    margin: 0 0 6px;
  }
  .dock {
    background: var(--sem-color-surface-solid);
    border-radius: var(--sem-radius-surface);
    padding: 12px;
    overflow: hidden;
  }
  /* The product supplies the turned wind ramp and each model's hue. */
  .demo-scale {
    --f5-chart-scale: linear-gradient(
      to top,
      var(--sem-color-wind-k00) 0%,
      var(--sem-color-wind-k05) 8%,
      var(--sem-color-wind-k09) 14%,
      var(--sem-color-wind-k10) 15%,
      var(--sem-color-wind-k15) 23%,
      var(--sem-color-wind-k20) 31%,
      var(--sem-color-wind-k25) 38%,
      var(--sem-color-wind-k30) 46%,
      var(--sem-color-wind-k35) 54%,
      var(--sem-color-wind-k40) 62%,
      var(--sem-color-wind-k45) 69%,
      var(--sem-color-wind-k50) 77%,
      var(--sem-color-wind-k60) 92%,
      var(--sem-color-wind-k65) 100%
    );
  }
  .short {
    --f5-chart-height: 104px;
  }
  .card-holder {
    display: flex;
    justify-content: center;
    margin-top: -60px;
  }
  /* An open non-modal dialog is absolutely positioned by the UA. The product
     anchors it to the filter button; the demo just lets it sit in the page. */
  .f5-forecast-filter[open] {
    position: static;
  }
</style>

<template id="chart">
  <div class="f5-forecast-chart f5-forecast-chart--blend demo-scale">

      <span
        class="f5-forecast-chart__scale"
        role="img"
        aria-label="Wind scale, 0 to 40 knots"
      ></span>
      <span class="f5-forecast-chart__ticks" aria-hidden="true">
        <span style="top: 7px">40</span>
        <span style="top: 40px">30</span>
        <span style="top: 73px">20</span>
        <span style="top: 106px">10</span>
        <span style="top: 137px">0</span>
      </span>
    </div>
    <div class="f5-forecast-chart__plot">
      <svg
        class="f5-forecast-chart__svg"
        width="560"
        height="140"
        role="img"
        aria-label="Model blend: wind between 8 and 26 knots across 4 model lines. The table view lists every value."

          <linearGradient
            id="ramp"
            gradientUnits="userSpaceOnUse"
            x1="0"
            y1="137"
            x2="0"
            y2="7"

            <stop offset="0.125" stop-color="var(--sem-color-wind-k05)" />

            <stop offset="0.375" stop-color="var(--sem-color-wind-k15)" />
            <stop offset="0.5" stop-color="var(--sem-color-wind-k20)" />
            <stop offset="0.625" stop-color="var(--sem-color-wind-k25)" />
            <stop offset="0.75" stop-color="var(--sem-color-wind-k30)" />

          height="140"

          y2="73"

        <line
          class="f5-forecast-chart__gridline"
          x1="0"
          x2="560"
          y1="106"
          y2="106"
        />
        <g class="f5-forecast-chart__bands">
          <path

            fill="url(#ramp)"
            d="M0 96 C40 90 80 70 140 62 C200 54 260 60 320 48 C380 36 440 40 560 30 L560 74 C440 82 380 78 320 86 C260 94 200 92 140 98 C80 104 40 110 0 116 Z"
          />
          <path
            class="f5-forecast-chart__band f5-forecast-chart__band--mid"
            fill="url(#ramp)"
            d="M0 102 C40 97 80 80 140 72 C200 64 260 69 320 58 C380 47 440 50 560 41 L560 65 C440 74 380 70 320 77 C260 85 200 83 140 89 C80 95 40 101 0 108 Z"
          />
          <path
            class="f5-forecast-chart__band f5-forecast-chart__band--core"
            fill="url(#ramp)"
            d="M0 105 C40 100 80 84 140 77 C200 69 260 73 320 63 C380 52 440 55 560 46 L560 58 C440 67 380 64 320 71 C260 79 200 77 140 84 C80 90 40 97 0 105 Z"
          />
          <path
            class="f5-forecast-chart__band f5-forecast-chart__band--gust"
            fill="url(#ramp)"
            d="M0 106 C40 100 80 82 140 74 C200 66 260 71 320 60 C380 49 440 52 560 43 L560 22 C440 30 380 26 320 36 C260 48 200 42 140 50 C80 58 40 78 0 84 Z"
          />
        </g>
        <path
          class="f5-forecast-chart__model"
          style="--f5-model-hue: #1a9e8a"
          d="M0 104 C40 99 80 83 140 76 C200 68 260 72 320 62 C380 51 440 54 560 45"
        />
        <path
          class="f5-forecast-chart__model f5-forecast-chart__model--gust"
          style="--f5-model-hue: #1a9e8a"
          d="M0 88 C40 82 80 66 140 58 C200 50 260 54 320 44 C380 33 440 36 560 27"
        />
        <path
          class="f5-forecast-chart__model"
          style="--f5-model-hue: #3f6fd8"
          d="M0 110 C40 104 80 88 140 80 C200 72 260 76 320 66 C380 55 440 58 560 49"
        />
        <path
          class="f5-forecast-chart__model"
          style="--f5-model-hue: #8a4bc9"
          d="M0 99 C40 94 80 78 140 71 C200 63 260 67 320 57 C380 46 440 49 560 40"
        />
        <path
          class="f5-forecast-chart__model f5-forecast-chart__model--member"
          style="--f5-model-hue: #6e5bd6"
          d="M0 113 C40 108 80 92 140 85 C200 77 260 81 320 71 C380 60 440 63 560 54"
        />
        <path
          class="f5-forecast-chart__median"
          d="M0 104 C40 99 80 82 140 75 C200 67 260 71 320 61 C380 50 440 53 560 44"
        />
        <g transform="translate(140 75) rotate(220)">
          <path
            class="f5-forecast-chart__arrow-halo"
            d="M0 -5 L0 5 M-3 1.6 L0 5 L3 1.6"
          />
          <path
            class="f5-forecast-chart__arrow"
            d="M0 -5 L0 5 M-3 1.6 L0 5 L3 1.6"
          />
        </g>
        <g transform="translate(320 61) rotate(250)">
          <path
            class="f5-forecast-chart__arrow-halo"
            d="M0 -5 L0 5 M-3 1.6 L0 5 L3 1.6"
          />
          <path
            class="f5-forecast-chart__arrow"
            d="M0 -5 L0 5 M-3 1.6 L0 5 L3 1.6"
          />
        </g>
        <line class="f5-forecast-chart__now" x1="96" x2="96" y1="0" y2="140" />
      </svg>
    </div>
  </div>
</template>

<template id="empty">
  <div
    class="f5-forecast-chart f5-forecast-chart--blend demo-scale short"
    data-state="empty"
  >
    <div class="f5-forecast-chart__gutter">
      <span
        class="f5-forecast-chart__scale"
        role="img"
        aria-label="Wind scale, 0 to 40 knots"
      ></span>
    </div>
    <div class="f5-forecast-chart__plot">
      <p class="f5-forecast-chart__empty" role="status">
        No model publishes a series for this spot yet.
      </p>
    </div>
  </div>
</template>

<template id="waves">
  <div class="f5-forecast-chart f5-forecast-chart--blend demo-scale short">
    <div class="f5-forecast-chart__gutter">
      <span
        class="f5-forecast-chart__scale"
        role="img"
        aria-label="Wind scale, 0 to 40 knots"
      ></span>
    </div>
    <div class="f5-forecast-chart__plot">
      <svg
        class="f5-forecast-chart__svg"
        width="560"
        height="104"
        role="img"
        aria-label="Model blend: wind between 10 and 24 knots. A band along the foot shows wave height up to 6 metres; the Waves row prints it. The table view lists every value."
      >
        <!-- Behind the wind, along the foot, on its own 0-6 m scale. -->
        <path
          class="f5-forecast-chart__wave-band"
          d="M20 95 C 110 92, 200 86, 290 83 C 380 80, 470 84, 540 88 L540 104 L20 104 Z"
        />
        <path
          class="f5-forecast-chart__median"
          d="M20 62 C 110 55, 200 40, 290 34 C 380 30, 470 44, 540 52"
        />
      </svg>
    </div>
  </div>
  <!-- One marine row per sea state, drawn over the tide underlay. -->
  <table style="width: 100%; border-collapse: collapse; margin-top: 4px">
    <tr class="f5-forecast-chart__wave-row">
      <th
        scope="row"
        style="width: 56px; text-align: left; font-weight: 400"
        aria-label="Waves"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
          style="color: var(--sem-color-text-muted)"
        >
          <path d="M2 12c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3" />
          <path d="M2 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3" />
        </svg>
        <small
          style="
            font-size: var(--sem-text-eyebrow-font-size);
            color: var(--sem-color-text-muted);
          "
          >m</small
        >
      </th>
      <td style="text-align: center">
        <span class="f5-forecast-chart__wave-cell">
          <svg
            class="f5-forecast-chart__wave-arrow"
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            style="transform: rotate(315deg)"
          >
            <path d="M12 5v14M5 12l7 7 7-7" />
          </svg>
          <b>1.4</b><small>10s</small>
        </span>
      </td>
      <td style="text-align: center">
        <span class="f5-forecast-chart__wave-cell">
          <svg
            class="f5-forecast-chart__wave-arrow"
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            style="transform: rotate(300deg)"
          >
            <path d="M12 5v14M5 12l7 7 7-7" />
          </svg>
          <b>2.1</b><small>11s</small>
        </span>
      </td>
      <!-- No step fell close enough to this column: a dash, never a zero. -->
      <td style="text-align: center; color: var(--sem-color-text-muted)">
        &mdash;
      </td>
    </tr>
  </table>
</template>

<template id="weather">
  <!-- One row per surface reading, at the standard 24px. -->
  <table style="width: 100%; border-collapse: collapse">
    <tr class="f5-forecast-chart__weather-row">
      <th
        scope="row"
        style="width: 56px; text-align: left; font-weight: 400"
        aria-label="Weather"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          style="color: var(--sem-color-text-muted)"
        >
          <path d="M7 6.5a4.5 4.5 0 0 1 8.2 2" />
          <path d="M4 9.5 2.5 8M6 5 4.8 3.6M10.5 3V1.4" />
          <path d="M16 19H8a4 4 0 0 1 0-8 5 5 0 0 1 9.6 1.3A3.4 3.4 0 0 1 16 19Z" />
        </svg>
      </th>
      <!-- A code-table entry as one of nine shapes, in the row's own colour. -->
      <td style="text-align: center" title="Overcast (WMO present-weather code 3).">
        <span
          class="f5-forecast-chart__weather-cell"
          data-weather="cloudy"
          data-code="3"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M17.5 19H7a4.5 4.5 0 0 1 0-9 6 6 0 0 1 11.3 1.7A3.8 3.8 0 0 1 17.5 19Z"
            />
          </svg>
        </span>
      </td>
      <td style="text-align: center" title="Slight rain (WMO present-weather code 61).">
        <span
          class="f5-forecast-chart__weather-cell"
          data-weather="rain"
          data-code="61"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 15.5A4.5 4.5 0 0 1 6.1 7a6 6 0 0 1 11.3 1.7A3.8 3.8 0 0 1 19 15.5" />
            <path d="M8 18.5 7 21M12 18.5 11 21M16 18.5 15 21" />
          </svg>
        </span>
      </td>
      <td style="text-align: center; color: var(--sem-color-text-muted)">
        &mdash;
      </td>
    </tr>
    <tr class="f5-forecast-chart__weather-row">
      <th
        scope="row"
        style="width: 56px; text-align: left; font-weight: 400"
        aria-label="Rain"
      >
        <small
          style="
            font-size: var(--sem-text-eyebrow-font-size);
            color: var(--sem-color-text-muted);
          "
          >mm</small
        >
      </th>
      <!-- No interval at the run hour: a dash, never a zero. -->
      <td style="text-align: center; color: var(--sem-color-text-muted)">
        &mdash;
      </td>
      <td
        class="f5-forecast-chart__rain-cell"
        style="--rain-tint: 0.15; text-align: center"
        title="0.6 mm in the 3 hours to 21:00."
      >
        0.6
      </td>
      <!-- A dry interval the model did forecast reads as a zero. -->
      <td style="text-align: center">0</td>
    </tr>
    <tr class="f5-forecast-chart__weather-row">
      <th
        scope="row"
        style="width: 56px; text-align: left; font-weight: 400"
        aria-label="Cloud"
      >
        <small
          style="
            font-size: var(--sem-text-eyebrow-font-size);
            color: var(--sem-color-text-muted);
          "
          >%</small
        >
      </th>
      <td
        style="text-align: center"
        title="Total cloud 97 %, of which high 0 %, medium 73 %, low 89 %."
      >
        <span class="f5-forecast-chart__cloud-cell">
          <b>97</b>
          <i class="f5-forecast-chart__cloud-bars" aria-hidden="true">
            <s style="--cover: 0%"></s>
            <s style="--cover: 73%"></s>
            <s style="--cover: 89%"></s>
          </i>
        </span>
      </td>
      <!-- A reading that is a model approximation, not a measurement. -->
      <td
        class="f5-forecast-chart__proxy-cell"
        style="text-align: center"
        title="Model skin temperature 15.7 °C, approximate — not a measured sea temperature."
      >
        16
      </td>
      <td style="text-align: center; color: var(--sem-color-text-muted)">
        &mdash;
      </td>
    </tr>
  </table>
</template>

<template id="filter">
  <dialog class="f5-forecast-filter" open aria-label="Forecast display options">
    <h2 style="margin-top: 0">Show</h2>
    <div class="f5-forecast-filter__switches">

<script>
  // Demo scaffolding: the same markup is stamped into both modes so the two
  // columns cannot drift apart. The gradient id is made unique per copy.
  const parts = [
    [
      "--blend &mdash; bands, model lines, median, arrows, night shading, Now",
      "chart",
    ],
    ["--candles &mdash; wick, body, median tick, gust bar", "candles"],
    [
      "__wave-band with __wave-row &mdash; waves on their own 0&ndash;6 m scale",
      "waves",
    ],
    [
      "__weather-row &mdash; present weather, tinted rain, cloud levels, a proxy",
      "weather",
    ],
    ['[data-state="empty"] &mdash; no series for this spot', "empty"],
    ["__card &mdash; a column under the pointer", "card"],
    [".f5-forecast-filter[open] &mdash; switches, units, models", "filter"],
  ];
  let seq = 0;
  for (const host of document.querySelectorAll("[data-demo]")) {
    for (const [caption, id] of parts) {
      const block = document.createElement("div");
      block.innerHTML = `<p class="cap">${caption}</p>`;
      const shell = document.createElement("div");
      shell.className = id === "filter" || id === "card" ? "" : "dock";
      const copy = document.getElementById(id).content.cloneNode(true);
      const unique = `ramp-${seq++}`;
      copy.querySelectorAll("linearGradient").forEach((node) => {
        node.id = unique;
      });
      copy.querySelectorAll("[fill^='url(#ramp']").forEach((node) => {
        node.setAttribute("fill", `url(#${unique})`);
      });
      shell.appendChild(copy);
      block.appendChild(shell);
      host.appendChild(block);
    }
  }
</script>
