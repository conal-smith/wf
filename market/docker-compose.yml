# Local Postgres for the marketplace API. Nothing else: photos use the local
# storage driver in development and Clerk is replaced by MARKET_AUTH_MODE=dev.
#
#   npm run market:db
#   DATABASE_URL=postgres://market:market@127.0.0.1:55432/market npm run market:api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - market-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  market-pg:
